name: inspect
on:
  workflow_dispatch:   # только ручной запуск — эксперимент, писем при коммитах не будет
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04   # закреплено, чтобы 19.10 не переехать на Ubuntu 26 вслепую
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python collector/inspect_data.py && python collector/inspect_night.py
