name: collect
on:
  schedule:
    - cron: "7,37 5-20 * * *"   # 08:07–23:37 по Минску, каждые 30 минут
    - cron: "7 21 * * *"        # 00:07 по Минску — последний замер; ночь = 0:00–8:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "config/**", ".github/workflows/collect.yml"]
concurrency:
  group: collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04   # закреплено, чтобы 19.10 не переехать на Ubuntu 26 вслепую
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q requests cryptography
      - name: collect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: python collector/radar.py
