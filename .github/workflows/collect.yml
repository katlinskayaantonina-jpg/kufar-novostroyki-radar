name: collect
on:
  schedule:
    - cron: "7 3-21 * * *"   # 06:07–00:07 по Минску, каждый час; ночь = 0:00–6:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "config/**", ".github/workflows/collect.yml"]
concurrency:
  group: collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests cryptography
      - name: collect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
        run: python collector/radar.py
