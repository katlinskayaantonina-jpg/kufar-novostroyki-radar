name: export-cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Удалить временную ветку с зашифрованной выгрузкой
        run: git init -q tmp && cd tmp && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete export-tmp
