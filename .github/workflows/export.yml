name: export-profile
on:
  workflow_dispatch:
    inputs:
      profile_id: { description: "Kufar profile id", required: true }
      profile_name: { description: "Имя", required: false }
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q requests cryptography
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RADAR_KEY: ${{ secrets.RADAR_KEY }}
          PROFILE_ID: ${{ inputs.profile_id }}
          PROFILE_NAME: ${{ inputs.profile_name }}
        run: python collector/export_profile.py
      - name: Передать зашифрованный файл через временную ветку
        run: |
          cd out
          git init -q -b export-tmp
          git config user.name radar-bot; git config user.email radar-bot@users.noreply.github.com
          git add export.enc && git commit -qm "temp encrypted export"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" export-tmp
