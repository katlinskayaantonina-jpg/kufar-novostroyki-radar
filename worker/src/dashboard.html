<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Радар новостроек</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efeb; --line:#e3e1db;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#86847d;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --views:#2a78d6; --phones:#eb6834;
  --heat-0:#eef4fb; --heat-1:#c9dcf3; --heat-2:#90b8e8; --heat-3:#4f8fd9; --heat-4:#1f5fae;
  --warn:#9a5b00; --warn-soft:#fdf1dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8d84;
    --accent:#4fb08c; --accent-ink:#0b0b0b; --accent-soft:#1f3a30;
    --views:#3987e5; --phones:#d95926;
    --heat-0:#1d2530; --heat-1:#1f3a5c; --heat-2:#28568c; --heat-3:#3a78c2; --heat-4:#6aa6ec;
    --warn:#e3a54a; --warn-soft:#3a2c14;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8d84;
  --accent:#4fb08c; --accent-ink:#0b0b0b; --accent-soft:#1f3a30;
  --views:#3987e5; --phones:#d95926;
  --heat-0:#1d2530; --heat-1:#1f3a5c; --heat-2:#28568c; --heat-3:#3a78c2; --heat-4:#6aa6ec;
  --warn:#e3a54a; --warn-soft:#3a2c14;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
details.fbox>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fbox>summary::-webkit-details-marker{display:none}
details.fbox[open]>summary{margin-bottom:10px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:13px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.filters{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-weight:600;min-width:96px;color:var(--ink-2);font-size:13px}
button,select,input{font:inherit;color:inherit}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--views);outline-offset:2px}
input[type=search],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;cursor:pointer}
.emp-box{position:relative}
.emp-list{position:absolute;z-index:20;top:110%;left:0;width:min(340px,90vw);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.emp-list label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.emp-list label:hover{background:var(--surface-2)}
.emp-list .muted{font-size:12px}
.tabs{display:flex;gap:4px;margin:16px 0 10px;overflow-x:auto;padding-bottom:2px}
.tab{border:none;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k{color:var(--ink-2);font-size:13px}
.kpi .h{color:var(--ink-3);font-size:12px;margin-top:2px}
h2{font-size:17px;margin:4px 0 10px}
.muted{color:var(--ink-3)}
.note{color:var(--ink-2);font-size:13px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:12px}
.sec{margin-top:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.title{white-space:normal;min-width:220px;max-width:360px}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:var(--surface-2);display:block}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-right:3px}
.badge.on{background:var(--warn-soft);color:var(--warn);border-color:transparent}
a{color:var(--views)}
.chart{width:100%;display:block}
.chart text{fill:var(--ink-2);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.bar-v{fill:var(--views)} .bar-p{fill:var(--phones)}
.bar-x{fill:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:4px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;gap:2px;font-size:11px}
.heat .c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-variant-numeric:tabular-nums}
.heat .hd{color:var(--ink-2);text-align:center}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:8px;font-size:12px;z-index:50;display:none;max-width:260px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);padding:18px;overflow:auto}
.center{padding:40px;text-align:center;color:var(--ink-2)}
.more{margin:10px auto;display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:10px}
.cgrid.one{grid-template-columns:1fr}
.cgrid:not(.one){grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
.cgrid:not(.one) .acard{flex-direction:column;padding:0;overflow:hidden;gap:0}
.cgrid:not(.one) .acard img,.cgrid:not(.one) .acard .noimg{width:100%;height:auto;aspect-ratio:4/3;border-radius:0}
.cgrid:not(.one) .ab{padding:8px 10px 10px}
.cgrid:not(.one) .at{font-size:12px}
.cgrid:not(.one) .am,.cgrid:not(.one) .aw,.cgrid:not(.one) .ad8{font-size:11px}
.cgrid:not(.one) .amet{font-size:11px}.cgrid:not(.one) .amet b{font-size:13px}
.acard{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;min-width:0}
.acard:hover{border-color:var(--accent)}
.acard img,.acard .noimg{width:92px;height:72px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--surface-2)}
.ab{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.at{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.am{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad8{font-size:12px;color:var(--ink-3)}
.aw{font-size:12px;color:var(--ink-2)}
.amet{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}.amet b{color:var(--ink);font-size:14px}
.badge.fast{background:#fff1d6;color:#8a5a00;border-color:transparent}
:root[data-theme="dark"] .badge.fast{background:#3a2c14;color:#e3a54a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.fast{background:#3a2c14;color:#e3a54a}}
tr.grp th{font-size:11px;text-align:center;color:var(--ink-3);border-bottom:none;padding-bottom:0}
.gs{border-left:1px solid var(--line)}
td.bestcell{background:var(--accent-soft);font-weight:700}
tr.toprow td:first-child{font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px}
.grid4 h3{margin:0 0 4px;font-size:14px}
.chart .ghost{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 3}
.chart .gl{fill:var(--ink-3)}
.track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}.track div{height:100%;background:var(--views);border-radius:999px}
.cntbtn{border:1px solid var(--line);background:var(--accent-soft);border-radius:8px;padding:2px 10px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}

.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pgrid3.tiny{margin-top:10px;font-size:12px;text-align:center}
.agentcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.agenttop{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.adnow{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.adnow a{font-weight:600;text-decoration:none;color:var(--ink);display:block;font-size:13px}
.adnow-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:4px}
.pill2{border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;white-space:nowrap}
.pill2.vip{background:color-mix(in srgb,var(--views) 18%,transparent);color:var(--ink)}
.pill2.highlight{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink)}
.score{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.score.r1{border-color:#d9b44a}.score.r2{border-color:#9fbfa9}.score.r3{border-color:#d1a07c}
.bignum{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
tr.lead td{background:var(--accent-soft)}
.callout{border-radius:12px;padding:16px;background:var(--accent-soft)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.hbar .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}.hbar .track div{height:100%;background:var(--views);border-radius:999px}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}.lg.off{opacity:.35;text-decoration:line-through}
@media (max-width:820px){.pgrid3,.pgrid2{grid-template-columns:1fr}}

@media (max-width:640px){ .lbl{min-width:auto;width:100%} .kpi .v{font-size:22px} h1{font-size:20px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Радар новостроек</h1>
      <div class="sub">Кто разместил объявления, что получило внимание и когда открывали номер.</div>
    </div>
    <span class="pill" id="status">Загрузка…</span>
  </header>

  <details class="panel fbox" id="fbox" open><summary><span>Фильтры</span><span class="muted" id="fsum"></span></summary><section class="filters" aria-label="Фильтры">
    <div class="row" id="periods"></div>
    <div class="row" id="customRow" hidden>
      <span class="lbl">Свой период</span>
      <input type="date" id="dFrom"> — <input type="date" id="dTo">
    </div>
    <div class="row" id="weekdays"><span class="lbl">Дни недели</span></div>
    <div class="row">
      <span class="lbl">Компания</span>
      <span id="companies"></span>
    </div>
    <div class="row">
      <span class="lbl">Сотрудники</span>
      <div class="emp-box">
        <button class="btn" id="empBtn" aria-expanded="false">Все сотрудники ▾</button>
        <div class="emp-list" id="empList" hidden></div>
      </div>
      <span class="lbl" style="min-width:auto;margin-left:8px">Комнат</span>
      <span id="rooms"></span>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="Поиск по заголовку, адресу или номеру объявления">
      <label class="chip" style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" id="newOnly" checked> только новостройки</label>
      <button class="btn" id="reset">Сбросить фильтры</button>
    </div>
  </section></details>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"><div class="center">Загружаю данные…</div></main>
</div>
<div class="tip" id="tip"></div>
<div class="drawer" id="drawer"><div class="in" id="drawerIn"></div></div>

<script>
"use strict";
const KEY = new URLSearchParams(location.search).get("k") || "";
const TZ_OFF = 3 * 3600 * 1000; // Минск, UTC+3
const NIGHT = 24, SPREAD = 25;
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const EV_NAMES = {new:"Новое", gone:"Снято", back:"Вернулось", raise:"Поднятие", price:"Цена", promo_hl:"Выделение", promo_pp:"Закреп вверху", promo_rb:"Ленточка", title:"Заголовок", photo:"Обложка"};
const TABS = [["overview","Обзор"],["promo","Продвижение"],["ads","Объявления за период"],["employees","Сотрудники"],["hours","По часам"],["placed","Что размещают"],["organic","Топ органика"],["promoted","Топ продвижение"]];

let CAT = null, CUBE = null, STATUS = null;
const S = { period:"7", from:"", to:"", wd:new Set(), company:"all", emps:new Set(), rooms:new Set(), q:"", newOnly:true, tab:"overview", sort:{}, limit:60 };

const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("ru-RU");
const fmtS = n => n >= 1e6 ? fmt1(n/1e6)+" млн" : n >= 1e4 ? fmt1(n/1e3)+" тыс" : fmt(n);
const fmt1 = n => n == null || !isFinite(n) ? "—" : n.toLocaleString("ru-RU",{maximumFractionDigits:1});
const pct = (a,b) => b ? (100*a/b).toLocaleString("ru-RU",{maximumFractionDigits:1})+"%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayStr = ms => new Date(ms + TZ_OFF).toISOString().slice(0,10);
const todayStr = () => dayStr(Date.now());
const addDays = (d, n) => dayStr(Date.parse(d+"T00:00:00Z") - TZ_OFF + n*86400000 + 12*3600000);
const wdOf = d => (new Date(d+"T12:00:00Z").getUTCDay() + 6) % 7;
const dtLocal = ts => { if(!ts) return "—"; const d = new Date(ts*1000+TZ_OFF); return d.toISOString().slice(8,10)+"."+d.toISOString().slice(5,7)+" "+d.toISOString().slice(11,16); };
const hourOfTs = ts => new Date(ts*1000+TZ_OFF).getUTCHours();
const dayOfTs = ts => dayStr(ts*1000);
let EUR_RATE = 0.86;
const eur = a => a ? (a.pe || (a.pu ? Math.round(a.pu*EUR_RATE) : null)) : null;
const roomKey = r => { const n = parseInt(r,10); return !n ? "?" : n >= 4 ? "4+" : String(n); };

async function getJSON(name){
  const r = await fetch(`/d/${name}?k=${encodeURIComponent(KEY)}`, {cache:"no-store"});
  if(!r.ok) throw new Error(name+": "+r.status);
  return r.json();
}

// ---------- сотрудники
function empKey(a){ return a.pid ? "p:"+a.pid : a.cn ? "c:"+a.cn : "u"; }
function empName(key){
  if(key === "u") return "Не определён";
  if(key.startsWith("p:")){ const p = CAT.profiles[key.slice(2)]; return (p && p.name) ? p.name : "Профиль "+key.slice(2); }
  return key.slice(2)+" (не подтверждён)";
}
function empCompany(key){
  if(key.startsWith("p:")){ const p = CAT.profiles[key.slice(2)]; return p ? p.company : ""; }
  return "";
}

// ---------- фильтры
function periodDays(){
  const t = todayStr();
  let from, to = t;
  if(S.period === "today") from = t;
  else if(S.period === "yesterday"){ from = addDays(t,-1); to = from; }
  else if(S.period === "custom"){ from = S.from || t; to = S.to || t; }
  else if(S.period === "all"){ const ks = Object.keys(CUBE.days).sort(); from = ks[0] || t; }
  else from = addDays(t, -(parseInt(S.period,10)-1));
  if(from > to) [from, to] = [to, from];
  const out = [];
  for(let d = from; d <= to; d = addDays(d,1)){ if(!S.wd.size || S.wd.has(wdOf(d))) out.push(d); if(out.length > 400) break; }
  return out;
}
function adOk(id, a){
  if(!a) return false;
  if(S.newOnly && !a.nw) return false;
  if(S.company !== "all" && a.c !== S.company) return false;
  if(S.emps.size && !S.emps.has(empKey(a))) return false;
  if(S.rooms.size && !S.rooms.has(roomKey(a.r))) return false;
  if(S.q){
    const q = S.q.toLowerCase();
    if(!(id.includes(q) || (a.t||"").toLowerCase().includes(q) || (a.ad||"").toLowerCase().includes(q))) return false;
  }
  return true;
}
function vhOk(pid, rooms){
  if(S.rooms.size && !S.rooms.has(roomKey(rooms))) return false;
  if(S.emps.size && !S.emps.has("p:"+pid)) return false;
  if(S.company !== "all"){ const p = CAT.profiles[pid]; if(!p || p.company !== S.company) return false; }
  return true;
}

// ---------- агрегирование выбранного периода
function aggregate(){
  const days = periodDays();
  const ads = CAT.ads;
  const per = new Map();   // id -> {dv,dp,ev:[]}
  const byDay = [];        // [{d,dv,dp}]
  const phHour = new Array(26).fill(0), vHour = new Array(26).fill(0);
  const heat = Array.from({length:7}, () => new Array(24).fill(0));
  const heatV = Array.from({length:7}, () => new Array(24).fill(0));
  const events = [];
  const covHour = new Array(26).fill(0);
  const ok = id => adOk(id, ads[id]);
  for(const d of days){
    const D = CUBE.days[d]; let dv = 0, dp = 0;
    if(D){
      for(const id in D.a){ if(!ok(id)) continue; const [v,p] = D.a[id]; dv += v; dp += p;
        const x = per.get(id) || {dv:0,dp:0,ev:[]}; x.dv += v; x.dp += p; per.set(id,x); }
      for(const [id,h,n] of D.ph){ if(!ok(id)) continue; phHour[h] += n; if(h < 24) heat[wdOf(d)][h] += n; }
      for(const [pid,r,h,n] of D.vh){ if(!vhOk(pid,r)) continue; vHour[h] += n; if(h < 24) heatV[wdOf(d)][h] += n; }
      for(const e of D.ev){ if(!ok(e[1])) continue; events.push(e); const x = per.get(e[1]) || {dv:0,dp:0,ev:[]}; x.ev.push(e); per.set(e[1], x); }
      for(const h in (D.cov||{})) covHour[h] += D.cov[h];
    }
    byDay.push({d, dv, dp});
  }
  return {days, per, byDay, phHour, vHour, heat, heatV, events, covHour};
}

// ---------- графики (SVG)
function barChart(values, labels, cls, opts={}){
  const W = opts.w || (innerWidth < 640 ? 360 : 560), H = opts.h || (innerWidth < 640 ? 200 : 190), pl = 44, pb = 22, pt = 8;
  const ghost = opts.ghost || (() => false);
  const max = Math.max(1, ...values.filter((v,i) => !ghost(i)));
  const n = values.length, bw = (W-pl-6)/n, gap = Math.min(4, bw*0.25);
  const nice = niceMax(max), ticks = [0, nice/2, nice];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||"")}">`;
  for(const t of ticks){ const y = pt + (H-pt-pb)*(1-t/nice); s += `<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmtS(t)}</text>`; }
  values.forEach((v,i) => {
    const h = (H-pt-pb)*Math.min(v, nice)/nice, x = pl + i*bw + gap/2, y = H-pb-h, w = Math.max(1,bw-gap);
    const c = (opts.special && opts.special(i)) ? "bar-x" : cls;
    if(ghost(i)){ if(v > 0) s += `<rect class="ghost" x="${x+1}" y="${y+1}" width="${w-2}" height="${Math.max(0,h-1)}" rx="3" data-tip="${esc(labels[i])}: ${fmt(v)}"/><text x="${x+w/2}" y="${Math.max(pt+9,y-3)}" text-anchor="middle" class="gl">${fmtS(v)}</text>`; }
    else if(v > 0) s += `<path class="${c}" d="${roundTop(x,y,w,h)}" data-tip="${esc(labels[i])}: ${fmt(v)}"/>`;
    s += `<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(labels[i])}: ${fmt(v)}"/>`;
    const every = Math.ceil(n/(innerWidth < 640 ? 9 : 14));
    if(i % every === 0) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(opts.short ? opts.short(i) : labels[i])}</text>`;
  });
  return s + `</svg>`;
}
function roundTop(x,y,w,h){ const r = Math.min(4, w/2, h); return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`; }
function niceMax(m){ const p = Math.pow(10, Math.floor(Math.log10(m))); for(const k of [1,2,2.5,5,10]) if(k*p >= m) return k*p; return 10*p; }

function heatmap(grid, title){
  const H0 = 6;
  const max2 = Math.max(1, ...grid.flatMap(r => r.slice(H0)));
  let s = `<div style="overflow-x:auto"><div class="heat" style="grid-template-columns:28px repeat(${24-H0},minmax(26px,1fr));min-width:520px" role="table" aria-label="${esc(title)}"><div></div>`;
  for(let h=H0; h<24; h++) s += `<div class="hd">${h}</div>`;
  grid.forEach((row,w) => {
    s += `<div class="hd" style="text-align:left">${WD[w]}</div>`;
    row.slice(H0).forEach((v,i) => { const h = i + H0; const max = max2; const lvl = v ? Math.min(4, Math.ceil(4*v/max)) : 0;
      s += `<div class="c" style="background:var(--heat-${lvl});${lvl>=3?"color:#fff":""}" data-tip="${WD[w]}, ${h}:00–${h+1}:00 — ${fmt(v)}">${v ? fmt(v) : ""}</div>`; });
  });
  return s + `</div></div>`;
}

// ---------- карточки объявлений
function adRows(A, onlyWithActivity){
  const ads = CAT.ads, rows = [], days = new Set(A.days);
  const ids = onlyWithActivity ? [...A.per.keys()] : Object.keys(ads).filter(id => adOk(id, ads[id]) && (ads[id].act || A.per.has(id)));
  for(const id of ids){
    const a = ads[id]; if(!a || !adOk(id,a)) continue;
    const x = A.per.get(id) || {dv:0,dp:0,ev:[]};
    const raises = x.ev.filter(e => e[2]==="raise").length;
    let promoDays = 0; for(const d of days){ const D = CUBE.days[d]; if(D && D.pr && D.pr[id]) promoDays++; }
    const promoEv = x.ev.some(e => e[2].startsWith("promo_") && e[4]);
    const placed = a.lt0 || a.lt || a.fs;
    rows.push({id, a, dv:x.dv, dp:x.dp, conv: x.dv ? x.dp/x.dv : 0, raises, promoDays, promo: promoDays>0 || promoEv,
      emp: empName(empKey(a)), ppm: eur(a) && a.a ? eur(a)/a.a : null, placed,
      lastRaise: a.lt && placed && a.lt - placed > 600 ? a.lt : null, area:a.a||0, price:eur(a)||0});
  }
  return rows;
}
let FAST = null;
function fastStart(){
  if(FAST) return FAST;
  const first = new Map(), dps = [], dvs = [], keys = Object.keys(CUBE.days).sort(), first0 = keys[0];
  for(const [id,a] of Object.entries(CAT.ads)){
    const t = a.lt0 || a.fs; if(!t) continue; const d0 = dayOfTs(t); if(!first0 || d0 <= first0) continue;   // размещено до начала истории — первых суток не видно
    const d1 = addDays(d0,1); let v = 0, p = 0;
    for(const d of [d0,d1]){ const x = CUBE.days[d] && CUBE.days[d].a[id]; if(x){ v += x[0]; p += x[1]; } }
    first.set(id,[v,p]); dvs.push(v); dps.push(p);
  }
  const q = (arr, k) => { if(!arr.length) return Infinity; const s = [...arr].sort((a,b)=>a-b); return s[Math.min(s.length-1, Math.floor(s.length*k))]; };
  FAST = {first, dpT: Math.max(3, q(dps, .85)), dvT: Math.max(40, q(dvs, .9))};
  return FAST;
}
function isFast(id){ const F = fastStart(), x = F.first.get(id); return x && (x[1] >= F.dpT || x[0] >= F.dvT) ? x : null; }
function promoBadges(a){
  let s = "";
  if(a.pp) s += `<span class="badge on">VIP</span>`;
  if(a.hl) s += `<span class="badge on">выделение</span>`;
  if(a.rb) s += `<span class="badge on">ленточка</span>`;
  return s;
}
function adCard(r, mode){

  if(r.lastRaise) dates += ` · поднято ${dtLocal(r.lastRaise)}`;
  if(mode === "promo" && (a.fv||a.fh)) dates = `Реклама с ${dtLocal(Math.min(a.fv||Infinity, a.fh||Infinity))} · ` + (r.lastRaise ? `поднято ${dtLocal(r.lastRaise)}` : `размещено ${dtLocal(r.placed)}`);
  if(!a.act) dates += ` · <b>снято ${dtLocal(a.ls)}</b>`;
  return `<div class="acard" data-ad="${r.id}" tabindex="0">

      <div class="ad8">${dates}</div>
      <div class="amet"><span><b>${fmt(r.dv)}</b> просм.</span><span><b>${fmt(r.dp)}</b> откр. номера</span><span>${r.dv?pct(r.dp,r.dv):"—"}</span></div>
      <div>${promoBadges(a)}${f ? `<span class="badge fast" title="Первые сутки после размещения: ${f[0]} просмотров, ${f[1]} открытий номера">🚀 быстрый старт</span>` : ""}${r.raises ? `<span class="badge">поднятий: ${r.raises}</span>` : ""}</div>

}
function cardGrid(rows, mode, limitKey){

}
const AD_SORTS = [["dp","По открытиям номера"],["dv","По просмотрам"],["conv","По конверсии"],["placed","Новые сверху"],["lastRaise","Недавно поднятые"],["price","По цене"]];

let PLACED_GROUPS = new Map();
function viewPlaced(A){
  const ads = CAT.ads;
  const news = A.events.filter(e => e[2]==="new").map(e => [e, ads[e[1]]]).filter(x => x[1]);
  const byRooms = new Map(), byArea = new Map(), byWd = new Array(7).fill(0), byHour = new Array(24).fill(0);
  const groups = new Map();
  for(const [e,a] of news){
    const rk = roomKey(a.r); byRooms.set(rk, (byRooms.get(rk)||0)+1);
    const ak = a.a ? (a.a < 40 ? "до 40" : a.a < 55 ? "40–55" : a.a < 70 ? "55–70" : a.a < 90 ? "70–90" : "90+") : "?"; byArea.set(ak,(byArea.get(ak)||0)+1);
    const t = a.lt0 || e[0]; byWd[(new Date(t*1000+TZ_OFF).getUTCDay()+6)%7]++; byHour[hourOfTs(t)]++;
    const g = a.a ? (Math.round(a.a*10)/10).toFixed(1) : "?";
    if(!groups.has(g)) groups.set(g,{area:g, ids:[], emps:new Set(), rooms:new Set(), last:0, prices:[]});
    const G = groups.get(g); G.ids.push(e[1]); G.emps.add(empName(empKey(a))); G.rooms.add(a.r||"?"); G.last = Math.max(G.last, t); if(eur(a)) G.prices.push(eur(a));
  }

function openGroup(area){

// ---------- что работает: органика и продвижение
function topSection(title, sub, rows, mode){
  const group = (fn, keys) => { const m = new Map(); for(const r of rows){ const k = fn(r); const g = m.get(k)||{n:0,dv:0,dp:0}; g.n++; g.dv+=r.dv; g.dp+=r.dp; m.set(k,g); } return keys.filter(k=>m.has(k)).map(k=>[k,m.get(k)]); };
  const byRooms = group(r => roomKey(r.a.r), ["1","2","3","4+","?"]);
  const byPrice = group(r => !r.ppm ? "?" : r.ppm < 1200 ? "до 1200" : r.ppm < 1400 ? "1200–1400" : r.ppm < 1600 ? "1400–1600" : "1600+", ["до 1200","1200–1400","1400–1600","1600+","?"]);

    ${g.map(([k,v]) => `<tr><td>${esc(k)}</td><td class="num">${fmt(v.n)}</td><td class="num">${fmt1(v.dp/v.n)}</td><td class="num">${fmt1(v.dv/v.n)}</td><td class="num">${pct(v.dp,v.dv)}</td></tr>`).join("")}</tbody></table></div></div>`;
  const fastN = rows.filter(r => isFast(r.id)).length;
  return `<div class="panel sec"><h2>${title} · ${fmt(rows.length)}</h2><p class="note" style="margin-top:-4px">${sub} 🚀 быстрый старт: ${fastN}.</p>

    <h3 class="sec">ТОП-30 по открытиям номера</h3>${`<div class="cgrid">${rows.slice(0,30).map(r => adCard(r, mode)).join("")}</div>`}</div>`;
}
function viewTop(A, mode){
  const all = adRows(A,true).filter(r => r.dv || r.dp).sort((a,b) => b.dp-a.dp || b.dv-a.dv);
  return mode === "organic"
    ? topSection("Топ органика", "Без продвижения и без поднятий в выбранном периоде: что работает само по себе. Дата на карточке — размещение.", all.filter(r => !r.raises && !r.promo), "organic")
    : topSection("Топ продвижение", "С VIP, выделением или поднятием в выбранном периоде. Дата на карточке — начало рекламы и последнее поднятие.", all.filter(r => r.raises || r.promo), "promo");
}

// ---------- Продвижение (логика Kufar Promo Intelligence)
const P_COLORS = ['#2563eb','#e76f51','#2a9d8f','#7c3aed','#d97706','#db2777','#0891b2','#65a30d','#dc2626','#475569','#9333ea','#0f766e'];
const PS = { metric:"phoneviews", hidden:new Set(), agent:"Все", other:null };
function pcfg(){ return Object.assign({prices:{turbo:25,express:10,bump:1.5}, main_agents:[], excluded_agents:[], min_packages_for_efficiency:3}, CAT.promo||{}); }
function pAgent(id){ const a = CAT.ads[id]; return a ? empName(empKey(a)) : null; }
function pOrder(a,b){ const M = pcfg().main_agents, A = M.indexOf(a), B = M.indexOf(b); if(A>=0||B>=0){ if(A<0) return 1; if(B<0) return -1; return A-B; } return a.localeCompare(b,"ru"); }
function promoData(days){
  const ex = new Set(pcfg().excluded_agents), daySet = new Set(days);
  const promoDaily = [], effectDaily = [];
  for(const d of days){
    const D = CUBE.days[d]; if(!D) continue;
    for(const [id,code] of Object.entries(D.pr||{})){ const ag = pAgent(id); if(!ag || ex.has(ag)) continue; promoDaily.push({ad_id:id, day:d, promo_status: code===2?"vip":"highlight", agent:ag}); }
    for(const [id,by] of Object.entries(D.pe||{})){ const ag = pAgent(id); if(!ag || ex.has(ag)) continue;
      for(const [k,[v,p]] of Object.entries(by)) effectDaily.push({ad_id:id, day:d, promo_status: k==="2"?"vip":"highlight", agent:ag, views:v, phoneviews:p}); }
  }
  return {promoDaily, effectDaily, daySet};
}
function pPackages(){
  const ex = new Set(pcfg().excluded_agents), pr = pcfg().prices, out = [];
  for(const [id,a] of Object.entries(CAT.ads)){
    if(!(a.fv || a.fh)) continue; const ag = pAgent(id); if(!ag || ex.has(ag)) continue;
    const pkg = a.fv ? "turbo" : "express", ts = a.fv || a.fh;
    out.push({ad_id:id, agent:ag, package:pkg, purchase_ts:ts, purchase_day:dayOfTs(ts), price:+pr[pkg]||0, before: !!a.pb4});
  }
  return out;
}
function pAggregate(P, status){
  const m = new Map(), get = a => { if(!m.has(a)) m.set(a,{agent:a, adDays:0, views:0, phones:0}); return m.get(a); };
  for(const x of P.promoDaily) if(!status || x.promo_status===status) get(x.agent).adDays++;
  for(const x of P.effectDaily) if(!status || x.promo_status===status){ const r = get(x.agent); r.views += x.views; r.phones += x.phoneviews; }
  return [...m.values()].map(r => ({...r, viewsDay: r.adDays ? r.views/r.adDays : 0, phonesDay: r.adDays ? r.phones/r.adDays : 0}));
}
function pLeader(rows){ return [...rows].filter(x=>x.adDays>0).sort((a,b)=>(b.phones-a.phones)||(b.views-a.views)||a.agent.localeCompare(b.agent,"ru"))[0]?.agent || null; }
function pCurrent(){
  const ex = new Set(pcfg().excluded_agents), gen = CAT.generated, out = [];
  for(const [id,a] of Object.entries(CAT.ads)){
    if(!a.act || (a.ls||0) < gen - 600 || !(a.pp || a.hl)) continue;
    const ag = pAgent(id); if(!ag || ex.has(ag)) continue;
    const status = a.pp ? "vip" : "highlight", ts = a.fv || a.fh;
    let known = !!ts && !a.pb4, dayNum = null;
    if(known){ const n = Math.floor((gen - ts)/86400) + 1; if(n >= 1 && n <= (status==="vip"?3:7)) dayNum = n; else known = false; }
    out.push({ad_id:id, agent:ag, status, day_num:dayNum, known_start:known, a});
  }
  return out;
}
function pBadge(x){
  const lbl = x.status==="vip" ? "VIP" : "выделение", total = x.status==="vip" ? 3 : 7;
  return `<span class="pill2 ${x.status}">${lbl}${x.known_start && x.day_num ? `, день ${x.day_num} из ${total}` : " · дата начала не определена"}</span>`;
}
function pAdLine(x){
  const a = x.a;
  return `<div class="adnow ${x.status}"><a href="https://re.kufar.by/vi/${esc(x.ad_id)}" target="_blank" rel="noopener noreferrer">${esc(a.ad || a.t || "Объявление "+x.ad_id)}</a>
    <div class="adnow-meta"><span>${a.a!=null?fmt1(a.a)+" м² · ":""}${eur(a)?fmt(eur(a))+" €":""}</span>${pBadge(x)}</div></div>`;
}
function pTrend(P, days){
  const agents = [...new Set(P.effectDaily.map(x=>x.agent))].sort(pOrder);
  const map = new Map(); for(const x of P.effectDaily){ const k = x.agent+"|"+x.day; map.set(k,(map.get(k)||0)+(+x[PS.metric]||0)); }
  const color = new Map(agents.map((a,i)=>[a,P_COLORS[i%P_COLORS.length]]));
  const vis = agents.filter(a=>!PS.hidden.has(a));
  const W = 980, H = 300, pad = {l:52,r:18,t:16,b:38};
  const raw = Math.max(1, ...vis.flatMap(a=>days.map(d=>map.get(a+"|"+d)||0)));
  const maxY = niceMax(raw);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:640px">`;
  for(let i=0;i<=4;i++){ const v = maxY*(4-i)/4, y = pad.t+(H-pad.t-pad.b)*i/4; s += `<line class="grid" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end">${fmtS(v)}</text>`; }
  const lab = d => d.slice(8,10)+"."+d.slice(5,7);
  if(days.length === 1){
    const gap = (W-pad.l-pad.r)/Math.max(vis.length,1), bw = Math.max(18, Math.min(54, gap/1.6));
    vis.forEach((a,i)=>{ const v = map.get(a+"|"+days[0])||0, h = v/maxY*(H-pad.t-pad.b), x = pad.l+i*gap+(gap-bw)/2, y = H-pad.b-h;
      s += `<path d="${roundTop(x,y,bw,h)}" fill="${color.get(a)}" data-tip="${esc(a)}: ${fmt(v)}"/><text x="${x+bw/2}" y="${Math.max(12,y-6)}" text-anchor="middle">${fmt(v)}</text>`; });
    s += `<text x="${(pad.l+W-pad.r)/2}" y="${H-9}" text-anchor="middle">${lab(days[0])}</text>`;
  } else {
    const X = i => pad.l+(W-pad.l-pad.r)*(i/(days.length-1));
    vis.forEach(a=>{ const pts = days.map((d,i)=>{ const v = map.get(a+"|"+d)||0; return [X(i), H-pad.b-v/maxY*(H-pad.t-pad.b), v, d]; }), c = color.get(a);
      s += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0]+","+p[1]).join(" ")}"/>`;
      pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${c}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(a)} · ${lab(p[3])}: ${fmt(p[2])}"/>`); });
    days.forEach((d,i)=>{ if(days.length<=10 || i%Math.ceil(days.length/8)===0) s += `<text x="${X(i)}" y="${H-9}" text-anchor="middle">${lab(d)}</text>`; });
  }
  s += `</svg>`;
  const legend = agents.map(a=>`<button class="lg ${PS.hidden.has(a)?"off":""}" data-ptrend="${esc(a)}"><span class="sw" style="background:${color.get(a)}"></span>${esc(a)}</button>`).join("");
  return {svg:s, legend};
}
function pEfficiency(P, days){
  const cfg = pcfg(), daySet = P.daySet, last = days[days.length-1];
  const endTs = last === todayStr() ? STATUS.last_run : Date.parse(last+"T23:59:59+03:00")/1000;
  const pk = pPackages().filter(p => !p.before && daySet.has(p.purchase_day));
  const m = new Map(), row = a => { if(!m.has(a)) m.set(a,{agent:a, turbo:0, express:0, bumps:0, paid:0, worked:0, views:0, phones:0, packages:0}); return m.get(a); };
  for(const p of pk){
    const r = row(p.agent); r[p.package]++; r.packages++; r.paid += p.price;
    r.worked += p.price * Math.min(1, Math.max(0, (endTs - p.purchase_ts)/86400)/7);
    const end = p.purchase_ts + 7*86400;
    for(const e of P.effectDaily){ if(e.ad_id !== p.ad_id) continue; const t = Date.parse(e.day+"T12:00:00+03:00")/1000; if(t < p.purchase_ts || t > end) continue; r.views += e.views; r.phones += e.phoneviews; }
  }
  // поднятия без VIP и выделения в тот же день
  const ex = new Set(cfg.excluded_agents);
  for(const d of days){ const D = CUBE.days[d]; if(!D) continue;
    for(const e of D.ev){ if(e[2] !== "raise" || (D.pr||{})[e[1]]) continue; const ag = pAgent(e[1]); if(!ag || ex.has(ag)) continue; const r = row(ag); r.bumps++; r.paid += +cfg.prices.bump||0; r.worked += +cfg.prices.bump||0; } }
  return [...m.values()].map(r => ({...r, viewsRub: r.worked ? r.views/r.worked : 0, rubPhone: r.phones ? r.worked/r.phones : null, qualified: r.packages >= (cfg.min_packages_for_efficiency||3)}));
}

    return `<h3 style="margin:14px 0 6px">${title}</h3><div class="tbl-wrap"><table><thead><tr><th>Агент</th><th class="num">Объявл.-дней</th><th class="num">Просмотры</th><th class="num">Открытия тел.</th><th class="num">Просм./день</th><th class="num">Тел./день</th></tr></thead><tbody>${
      rows.length ? rows.map(x => `<tr class="${x.agent===lead?"lead":""}"><td>${esc(x.agent)}${x.agent===lead?' <span class="badge on">Лидер</span>':""}</td><td class="num">${fmt(x.adDays)}</td><td class="num">${fmt(x.views)}</td><td class="num">${fmt(x.phones)}</td><td class="num">${f1x(x.viewsDay)}</td><td class="num">${fmt2(x.phonesDay)}</td></tr>`).join("") : `<tr><td colspan="6" class="muted">Нет рекламы этого типа</td></tr>`}</tbody></table></div>`; };
  h += `<div class="panel sec"><h2>VIP и выделение без VIP</h2><p class="note" style="margin-top:-4px">Один день не считается дважды: если в этот день был VIP, он относится в VIP. В «Выделение без VIP» — только дни, когда выделение работало уже без VIP.</p>${stTable("vip","VIP")}${stTable("highlight","Выделение без VIP")}</div>`;
  // Динамика
  const T = pTrend(P, days);
  h += `<div class="panel sec"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h2>Динамика рекламы</h2>
    <div class="row"><button class="chip" data-pmetric="phoneviews" aria-pressed="${PS.metric==="phoneviews"}">Открытия телефона</button><button class="chip" data-pmetric="views" aria-pressed="${PS.metric==="views"}">Просмотры</button></div></div>
    <div style="overflow-x:auto">${T.svg}</div><div class="row" style="margin-top:6px">${T.legend}</div><p class="note">Нажмите на имя риелтора, чтобы скрыть или вернуть его линию.</p></div>`;
  // Эффективность
  const eff = pEfficiency(P, days).sort((a,b)=>pOrder(a.agent,b.agent));
  const q = eff.filter(x=>x.qualified && x.rubPhone!=null).sort((a,b)=>a.rubPhone-b.rubPhone), lead = q[0];
  const maxQ = Math.max(.001, ...q.map(x=>x.rubPhone));
  h += `<div class="panel sec"><h2>Эффективность покупок рекламы</h2><p class="note" style="margin-top:-4px">Учитываются пакеты, купленные внутри выбранного периода. В рейтинг цены результата входят агенты с ${cfg.min_packages_for_efficiency}+ пакетами. Цены: Турбо ${cfg.prices.turbo} руб., Экспресс ${cfg.prices.express} руб., поднятие ${cfg.prices.bump} руб.</p>
    <div class="grid2"><div class="callout"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em">Лидер по цене результата</div><div style="font-size:22px;font-weight:700;margin:6px 0">${lead?esc(lead.agent):"Недостаточно данных"}</div><div class="bignum">${lead?fmt2(lead.rubPhone)+" руб.":"—"}</div><div class="muted">за одно открытие телефона · меньше — лучше</div></div>
    <div><h3 style="margin:0 0 8px">Цена открытия телефона</h3>${q.length ? q.slice(0,8).map(x => `<div class="hbar"><span>${esc(x.agent)}</span><div class="track"><div style="width:${Math.max(3,x.rubPhone/maxQ*100)}%"></div></div><b>${fmt2(x.rubPhone)} руб.</b></div>`).join("") : `<p class="muted">Нет данных за период</p>`}</div></div>
    <div class="tbl-wrap sec"><table><thead><tr><th>Агент</th><th class="num">Турбо</th><th class="num">Экспресс</th><th class="num">Поднятия</th><th class="num">Оплачено</th><th class="num">Отработано</th><th class="num">Просмотры</th><th class="num">Открытия</th><th class="num">Просм./руб.</th><th class="num">Руб./открытие</th></tr></thead><tbody>${
      eff.length ? eff.map(x => `<tr class="${lead&&x.agent===lead.agent?"lead":""}" style="${x.qualified?"":"color:var(--ink-3);font-style:italic"}"><td>${esc(x.agent)}${lead&&x.agent===lead.agent?' <span class="badge on">Лидер</span>':""}</td><td class="num">${x.turbo}</td><td class="num">${x.express}</td><td class="num">${x.bumps}</td><td class="num">${f1x(x.paid)}</td><td class="num">${f1x(x.worked)}</td><td class="num">${fmt(x.views)}</td><td class="num">${fmt(x.phones)}</td><td class="num">${f1x(x.viewsRub)}</td><td class="num">${x.rubPhone==null?"—":fmt2(x.rubPhone)}</td></tr>`).join("") : `<tr><td colspan="10" class="muted">В этом периоде новых покупок рекламы не зафиксировано</td></tr>`}</tbody></table></div></div>`;
  // Все объявления в продвижении
  const statusBy = new Map(), daysBy = new Map(), effBy = new Map();
  for(const x of P.promoDaily){ if(!statusBy.has(x.ad_id)) statusBy.set(x.ad_id,new Set()); statusBy.get(x.ad_id).add(x.promo_status); daysBy.set(x.ad_id,(daysBy.get(x.ad_id)||0)+1); }
  for(const x of P.effectDaily){ const e = effBy.get(x.ad_id) || {v:0,p:0}; e.v += x.views; e.p += x.phoneviews; effBy.set(x.ad_id,e); }
  const pkMap = new Map(pPackages().map(x=>[x.ad_id,x]));
  const agentsList = ["Все", ...[...new Set([...ids].map(pAgent))].sort(pOrder)];
  let rows = [...ids].map(id => ({id, a:CAT.ads[id], agent:pAgent(id)}));
  if(PS.agent !== "Все") rows = rows.filter(r => r.agent === PS.agent);
  rows.sort((x,y)=>pOrder(x.agent,y.agent) || (x.a.ad||"").localeCompare(y.a.ad||"","ru"));
  h += `<div class="panel sec"><h2>Все объявления в продвижении · ${fmt(rows.length)}</h2><div class="row" style="margin-bottom:8px">${agentsList.map(a=>`<button class="chip" data-pagent="${esc(a)}" aria-pressed="${PS.agent===a}">${esc(a)}</button>`).join("")}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Агент</th><th>Объявление</th><th>Реклама</th><th class="num">Дней</th><th class="num">Просмотры</th><th class="num">Открытия</th><th class="num">Цена €</th></tr></thead><tbody>${
      rows.length ? rows.map(r => { const st = statusBy.get(r.id)||new Set(), e = effBy.get(r.id)||{v:0,p:0}, pk = pkMap.get(r.id);
        return `<tr><td>${esc(r.agent)}</td><td class="title"><a href="https://re.kufar.by/vi/${esc(r.id)}" target="_blank" rel="noopener noreferrer">${esc(r.a.ad||r.a.t||r.id)}</a><div class="muted" style="font-size:12px">${r.a.a!=null?fmt1(r.a.a)+" м² · ":""}${r.a.fl?esc(r.a.fl)+" эт.":""}</div></td>
          <td>${st.has("vip")?"VIP":st.has("highlight")?"выделение":"—"}${pk?" · "+(pk.package==="turbo"?"Турбо":"Экспресс"):""}</td><td class="num">${daysBy.get(r.id)||0}</td><td class="num">${fmt(e.v)}</td><td class="num">${fmt(e.p)}</td><td class="num">${fmt(eur(r.a))}</td></tr>`; }).join("") : `<tr><td colspan="7" class="muted">Нет объявлений для выбранного фильтра</td></tr>`}</tbody></table></div>
    <p class="note">Поднятия — по изменению даты публикации между соседними обходами; часть поднятий может быть пропущена. Пакеты, начавшиеся до начала истории (22.09), не считаются купленными в известную дату. Учитываются только объявления в Минск-Мире. Фильтры сотрудников и комнатности на эту вкладку не действуют — только период.</p></div>`;
  return h;
}

// ---------- карточка объявления
function openAd(id){
  const a = CAT.ads[id]; if(!a) return;
  const keys = Object.keys(CUBE.days).sort();
  const series = keys.map(d => [d, (CUBE.days[d].a[id]||[0,0])]);
  const evs = keys.flatMap(d => CUBE.days[d].ev.filter(e => e[1]===id)).sort((x,y)=>y[0]-x[0]);
  const lab = series.map(x => x[0].slice(8,10)+"."+x[0].slice(5,7));
  $("#drawerIn").innerHTML = `<button class="btn" id="closeDrawer" style="float:right">Закрыть</button>
    <h2 style="margin-right:90px">${esc(a.t)}</h2>
    ${a.img?`<img src="${esc(a.img)}" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:10px">`:""}
    <p>${esc(a.ad||"")}<br>${esc(empName(empKey(a)))} · ${esc(CAT.companies[a.c]||"")}<br>
    ${esc(a.r||"?")} комн. · ${fmt1(a.a)} м² · этаж ${esc(a.fl||"?")}/${esc(a.ft||"?")} · ${fmt(eur(a))} € · ${eur(a)&&a.a?fmt(eur(a)/a.a)+" €/м²":""}<br>
    Размещено: ${dtLocal(a.lt0||a.lt)} · последнее поднятие: ${dtLocal(a.lt)} · всего просмотров: ${fmt(a.v)} · открытий номера: ${fmt(a.p)}<br>
    ${promoBadges(a)} ${a.act?"":"<b>Снято с публикации</b>"}</p>
    <p><a href="https://re.kufar.by/vi/${esc(id)}" target="_blank" rel="noopener noreferrer">Открыть на Kufar ↗</a></p>
    <h2>Просмотры по дням</h2>${barChart(series.map(x=>x[1][0]), lab, "bar-v")}
    <h2>Открытия номера по дням</h2>${barChart(series.map(x=>x[1][1]), lab, "bar-p")}
    <h2>События</h2>${evs.length ? `<table><tbody>${evs.map(e=>`<tr><td>${dtLocal(e[0])}</td><td>${esc(EV_NAMES[e[2]]||e[2])}</td><td class="muted">${e[2]==="price"?fmt(e[3]*EUR_RATE)+" → "+fmt(e[4]*EUR_RATE)+" €":e[2]==="raise"?dtLocal(e[3])+" → "+dtLocal(e[4]):""}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Событий пока нет.</p>`}`;
  $("#drawer").style.display = "block";
}

// ---------- отрисовка
function render(){
  const A = aggregate();
  const V = {overview:viewOverview, ads:viewAds, employees:viewEmployees, hours:viewHours, promo:()=>viewPromo(), placed:viewPlaced, organic:A=>viewTop(A,"organic"), promoted:A=>viewTop(A,"promo")}[S.tab];
  $("#view").innerHTML = V(A);
  renderControls();
}
function renderControls(){
  const P = [["today","Сегодня"],["yesterday","Вчера"],["7","7 дней"],["30","30 дней"],["90","90 дней"],["all","Всё время"],["custom","Свой период"]];
  $("#periods").innerHTML = `<span class="lbl">Период</span>` + P.map(([k,l]) => `<button class="chip" data-period="${k}" aria-pressed="${S.period===k}">${l}</button>`).join("");
  $("#customRow").hidden = S.period !== "custom";
  $("#weekdays").innerHTML = `<span class="lbl">Дни недели</span>` + WD.map((w,i) => `<button class="chip" data-wd="${i}" aria-pressed="${S.wd.has(i)}">${w}</button>`).join("");
  $("#companies").innerHTML = [["all","Все"], ...Object.entries(CAT.companies)].map(([k,l]) => `<button class="chip" data-company="${k}" aria-pressed="${S.company===k}">${esc(l)}</button>`).join(" ");
  $("#rooms").innerHTML = ["1","2","3","4+"].map(r => `<button class="chip" data-room="${r}" aria-pressed="${S.rooms.has(r)}">${r}</button>`).join(" ");
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  const P2 = Object.fromEntries(P);
  $("#fsum").textContent = [P2[S.period], S.company!=="all" ? CAT.companies[S.company] : "", S.emps.size ? "сотрудников: "+S.emps.size : "", S.rooms.size ? [...S.rooms].join(",")+" комн." : "", S.wd.size ? [...S.wd].sort().map(i=>WD[i]).join(",") : ""].filter(Boolean).join(" · ");
  $("#empBtn").textContent = (S.emps.size ? `Выбрано: ${S.emps.size}` : "Все сотрудники") + " ▾";
}
function renderEmpList(){
  const counts = new Map();
  for(const [id,a] of Object.entries(CAT.ads)){ if(!a.act) continue; if(S.company!=="all" && a.c!==S.company) continue; const k = empKey(a); counts.set(k,(counts.get(k)||0)+1); }
  const items = [...counts].sort((a,b) => b[1]-a[1]);
  $("#empList").innerHTML = `<input type="search" id="empQ" placeholder="Найти сотрудника" style="width:100%;margin-bottom:6px">
    <div id="empItems">${items.map(([k,n]) => `<label data-name="${esc(empName(k).toLowerCase())}"><input type="checkbox" data-emp-k="${esc(k)}" ${S.emps.has(k)?"checked":""}> ${esc(empName(k))} <span class="muted">${n}</span></label>`).join("")}</div>
    <button class="btn" id="empClear" style="margin-top:6px">Снять выбор</button>`;
}

// ---------- события интерфейса
document.addEventListener("click", ev => {
  const pt = ev.target.closest("[data-pother],[data-pmetric],[data-ptrend],[data-pagent]");
  if(pt){
    if(pt.dataset.pother !== undefined) PS.other = pt.dataset.pother && PS.other !== pt.dataset.pother ? pt.dataset.pother : null;
    if(pt.dataset.pmetric) PS.metric = pt.dataset.pmetric;
    if(pt.dataset.ptrend){ const a = pt.dataset.ptrend; PS.hidden.has(a) ? PS.hidden.delete(a) : PS.hidden.add(a); }
    if(pt.dataset.pagent) PS.agent = pt.dataset.pagent;
    render(); return;
  }
  const ga = ev.target.closest("[data-area]");
  if(ga){ openGroup(ga.dataset.area); return; }
  const t = ev.target.closest("[data-period],[data-wd],[data-company],[data-room],[data-tab],[data-sort],[data-ad],[data-emp],[data-more],#reset,#empBtn,#empClear,#closeDrawer");
  if(!t){ if(!ev.target.closest(".emp-box")) $("#empList").hidden = true; if(ev.target.id==="drawer") $("#drawer").style.display="none"; return; }
  if(t.dataset.period){ S.period = t.dataset.period; if(S.period==="custom" && !S.from){ S.to = todayStr(); S.from = addDays(S.to,-13); $("#dFrom").value=S.from; $("#dTo").value=S.to; } }
  else if(t.dataset.wd){ const i = +t.dataset.wd; S.wd.has(i) ? S.wd.delete(i) : S.wd.add(i); }
  else if(t.dataset.company){ S.company = t.dataset.company; }
  else if(t.dataset.room){ const r = t.dataset.room; S.rooms.has(r) ? S.rooms.delete(r) : S.rooms.add(r); }
  else if(t.dataset.tab){ S.tab = t.dataset.tab; S.limit = 60; }
  else if(t.dataset.sort){ const [tab,key] = t.dataset.sort.split(":"); const cur = S.sort[tab]; S.sort[tab] = {key, dir: cur && cur.key===key ? -cur.dir : -1}; }
  else if(t.dataset.ad){ openAd(t.dataset.ad); return; }
  else if(t.dataset.emp){ S.emps = new Set([t.dataset.emp]); S.tab = "ads"; }
  else if(t.dataset.more){ S.limit += 60; }
  else if(t.id === "reset"){ Object.assign(S, {period:"7", wd:new Set(), company:"all", emps:new Set(), rooms:new Set(), q:"", newOnly:true, limit:60}); $("#q").value=""; $("#newOnly").checked=true; }
  else if(t.id === "empBtn"){ const L = $("#empList"); if(L.hidden){ renderEmpList(); L.hidden = false; } else L.hidden = true; return; }
  else if(t.id === "empClear"){ S.emps.clear(); renderEmpList(); }
  else if(t.id === "closeDrawer"){ $("#drawer").style.display = "none"; return; }
  render(); saveState();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.dataset && t.dataset.empK !== undefined){ t.checked ? S.emps.add(t.dataset.empK) : S.emps.delete(t.dataset.empK); render(); saveState(); return; }
  if(t.id==="dFrom"){ S.from = t.value; render(); }
  if(t.id==="dTo"){ S.to = t.value; render(); }
  if(t.dataset && t.dataset.sortsel){ S.sort[t.dataset.sortsel] = {key:t.value, dir:-1}; S.limit = 60; render(); return; }
  if(t.id==="newOnly"){ S.newOnly = t.checked; render(); saveState(); }
});
let qTimer;
document.addEventListener("input", ev => {
  if(ev.target.id === "q"){ clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = ev.target.value.trim(); S.limit = 60; render(); }, 200); }
  if(ev.target.id === "empQ"){ const q = ev.target.value.toLowerCase(); document.querySelectorAll("#empItems label").forEach(l => l.style.display = l.dataset.name.includes(q) ? "" : "none"); }
});
document.addEventListener("keydown", ev => { if(ev.key === "Escape"){ $("#drawer").style.display = "none"; $("#empList").hidden = true; } });
const tip = $("#tip");
document.addEventListener("mousemove", ev => {
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if(!t){ tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (ev.clientY + 14) + "px";
});
function saveState(){ try{ localStorage.setItem("radar_f", JSON.stringify({period:S.period, tab:S.tab, company:S.company, newOnly:S.newOnly})); }catch(e){} }
function loadState(){ try{ const x = JSON.parse(localStorage.getItem("radar_f")||"{}"); Object.assign(S, x); }catch(e){} }

// ---------- старт
(async function(){
  loadState();
  if(!TABS.some(t => t[0] === S.tab)) S.tab = "overview";
  if(innerWidth < 640) $("#fbox").open = false;
  $("#newOnly").checked = S.newOnly;
  try{
    [CAT, CUBE, STATUS] = await Promise.all([getJSON("catalog"), getJSON("cube"), getJSON("status")]);
  }catch(e){
    $("#view").innerHTML = `<div class="center">Не удалось загрузить данные. Проверьте ссылку или обновите страницу через минуту.</div>`;
    $("#status").textContent = "Нет данных"; $("#status").classList.add("warn"); return;
  }
  const rs = Object.values(CAT.ads).filter(a => a.pe && a.pu).map(a => a.pe/a.pu).sort((x,y)=>x-y);
  if(rs.length) EUR_RATE = rs[Math.floor(rs.length/2)];
  const age = (Date.now()/1000 - STATUS.last_run) / 3600;
  $("#status").textContent = "Обновлено " + dtLocal(STATUS.last_run);
  const h = new Date(Date.now()+TZ_OFF).getUTCHours();
  if(age > 2 && h >= 9) { $("#status").classList.add("warn"); $("#status").textContent += " — давно не обновлялось"; }
  render();
})();
</script>
</body>
</html>
