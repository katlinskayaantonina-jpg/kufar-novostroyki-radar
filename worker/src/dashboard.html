<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Радар новостроек</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f2; --surface:#fcfcfb; --surface-2:#f0efeb; --line:#e3e1db;
  --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#86847d;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#e3efe9;
  --views:#2a78d6; --phones:#eb6834;
  --heat-0:#eef4fb; --heat-1:#c9dcf3; --heat-2:#90b8e8; --heat-3:#4f8fd9; --heat-4:#1f5fae;
  --warn:#9a5b00; --warn-soft:#fdf1dc;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8d84;
    --accent:#4fb08c; --accent-ink:#0b0b0b; --accent-soft:#1f3a30;
    --views:#3987e5; --phones:#d95926;
    --heat-0:#1d2530; --heat-1:#1f3a5c; --heat-2:#28568c; --heat-3:#3a78c2; --heat-4:#6aa6ec;
    --warn:#e3a54a; --warn-soft:#3a2c14;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8d84;
  --accent:#4fb08c; --accent-ink:#0b0b0b; --accent-soft:#1f3a30;
  --views:#3987e5; --phones:#d95926;
  --heat-0:#1d2530; --heat-1:#1f3a5c; --heat-2:#28568c; --heat-3:#3a78c2; --heat-4:#6aa6ec;
  --warn:#e3a54a; --warn-soft:#3a2c14;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
details.fbox>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fbox>summary::-webkit-details-marker{display:none}
details.fbox[open]>summary{margin-bottom:10px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-size:13px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.filters{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-weight:600;min-width:96px;color:var(--ink-2);font-size:13px}
button,select,input{font:inherit;color:inherit}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--views);outline-offset:2px}
input[type=search],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;cursor:pointer}
.emp-box{position:relative}
.emp-list{position:absolute;z-index:20;top:110%;left:0;width:min(340px,90vw);max-height:340px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.emp-list label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.emp-list label:hover{background:var(--surface-2)}
.emp-list .muted{font-size:12px}
.tabs{display:flex;gap:4px;margin:16px 0 10px;overflow-x:auto;padding-bottom:2px}
.tab{border:none;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .k{color:var(--ink-2);font-size:13px}
.kpi .h{color:var(--ink-3);font-size:12px;margin-top:2px}
h2{font-size:17px;margin:4px 0 10px}
.muted{color:var(--ink-3)}
.note{color:var(--ink-2);font-size:13px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:12px}
.sec{margin-top:12px}
.tbl-wrap.emp th{white-space:normal;vertical-align:bottom}
.tbl-wrap.emp table{table-layout:fixed;min-width:1160px;width:100%}
.tbl-wrap.emp td,.tbl-wrap.emp th{padding-left:6px;padding-right:6px}
.tbl-wrap.emp td:first-child{white-space:normal;overflow-wrap:anywhere}
.tbl-wrap.emp .employee-name{font-size:18px;line-height:1.25;font-weight:650}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface);cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.title{white-space:normal;min-width:220px;max-width:360px}
.thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:var(--surface-2);display:block}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin-right:3px}
.badge.on{background:var(--warn-soft);color:var(--warn);border-color:transparent}
a{color:var(--views)}
.chart{width:100%;display:block}
.chart text{fill:var(--ink-2);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.bar-v{fill:var(--views)} .bar-p{fill:var(--phones)}
.bar-x{fill:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:4px 0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat{display:grid;gap:2px;font-size:11px}
.heat .c{height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-variant-numeric:tabular-nums}
.heat .hd{color:var(--ink-2);text-align:center}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:8px;font-size:12px;z-index:50;display:none;max-width:260px}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);padding:18px;overflow:auto}
.center{padding:40px;text-align:center;color:var(--ink-2)}
.more{margin:10px auto;display:block}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:10px}
.cgrid.one{grid-template-columns:1fr}
.cgrid:not(.one){grid-template-columns:repeat(5,minmax(0,1fr))}
.cgrid:not(.one) .acard{flex-direction:column;padding:0;overflow:hidden;gap:0}
.cgrid:not(.one) .acard img,.cgrid:not(.one) .acard .noimg{width:100%;height:auto;aspect-ratio:1.45;border-radius:0}
.cgrid:not(.one) .ab{padding:7px 8px 8px}
.cgrid:not(.one) .at{font-size:12px}
.cgrid:not(.one) .am,.cgrid:not(.one) .aw,.cgrid:not(.one) .ad8{font-size:11px}
.cgrid:not(.one) .amet{font-size:11px}.cgrid:not(.one) .amet b{font-size:13px}
.acard{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;min-width:0}
.acard:hover{border-color:var(--accent)}
.acard img,.acard .noimg{width:92px;height:72px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:var(--surface-2)}
.ab{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.at{font-weight:600;font-size:13px;line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:clip}
.am{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad8{font-size:12px;color:var(--ink-3)}
.aw{font-size:12px;color:var(--ink-2)}
.amet{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}.amet b{color:var(--ink);font-size:14px}
.badge.fast{background:#fff1d6;color:#8a5a00;border-color:transparent}
:root[data-theme="dark"] .badge.fast{background:#3a2c14;color:#e3a54a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge.fast{background:#3a2c14;color:#e3a54a}}
tr.grp th{font-size:11px;text-align:center;color:var(--ink-3);border-bottom:none;padding-bottom:0}
.gs{border-left:1px solid var(--line)}
td.bestcell{background:var(--accent-soft);font-weight:700}
tr.toprow td:first-child{font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px}
.grid4 h3{margin:0 0 4px;font-size:14px}
.chart .ghost{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:4 3}
.chart .gl{fill:var(--ink-3)}
.track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}.track div{height:100%;background:var(--views);border-radius:999px}
.cntbtn{border:1px solid var(--line);background:var(--accent-soft);border-radius:8px;padding:2px 10px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}

.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.promo-kpis{gap:8px;margin-bottom:8px}
.promo-kpis .kpi{padding:5px 10px;height:76px;overflow:hidden;box-sizing:border-box}
.promo-kpis .kpi .v{font-size:23px;line-height:1.15}
.promo-kpis .kpi .k{font-size:12px;line-height:1.2}
.promo-kpis .kpi .h{font-size:10px;line-height:1.1;margin-top:1px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.pgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pgrid3.tiny{margin-top:10px;font-size:12px;text-align:center}
.agentcard{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface)}
.agenttop{display:flex;justify-content:space-between;gap:5px;font-size:12px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.adnow{margin-top:8px;padding:8px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.adnow a{font-weight:600;text-decoration:none;color:var(--ink);display:block;font-size:13px}
.adnow-meta{display:flex;justify-content:space-between;gap:4px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:4px}
.pill2{border-radius:999px;padding:3px 5px;font-size:10px;font-weight:600;white-space:nowrap}
.pill2.vip{background:color-mix(in srgb,var(--views) 18%,transparent);color:var(--ink)}
.pill2.highlight{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink)}
.score{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.score.r1{border-color:#d9b44a}.score.r2{border-color:#9fbfa9}.score.r3{border-color:#d1a07c}
.bignum{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
tr.lead td{background:var(--accent-soft)}
.callout{border-radius:12px;padding:16px;background:var(--accent-soft)}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:12px}
.hbar .track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}.hbar .track div{height:100%;background:var(--views);border-radius:999px}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}.lg.off{opacity:.35;text-decoration:line-through}
@media (max-width:1100px){.cgrid:not(.one){grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:900px){.cgrid:not(.one){grid-template-columns:repeat(3,minmax(0,1fr))}.pgrid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.pgrid3,.pgrid2,.pgrid4{grid-template-columns:1fr}.cgrid:not(.one){grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cgrid:not(.one){grid-template-columns:1fr}}

@media (max-width:640px){ .lbl{min-width:auto;width:100%} .kpi .v{font-size:22px} h1{font-size:20px} }

.acard.own-boriskina{position:relative;border:2px solid #07853e;background:#ecf8f1;box-shadow:0 1px 7px rgba(31,95,74,.10)}
.acard.own-boriskina .ab{background:#ecf8f1}
.acard.own-boriskina:hover{box-shadow:0 3px 11px rgba(31,95,74,.18)}
.acard.own-boriskina:after{content:"своё";position:absolute;top:7px;right:7px;background:#087a39;color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:999px;font-size:11px;line-height:1.1;font-weight:700;padding:5px 10px;box-shadow:0 1px 4px rgba(0,0,0,.17);pointer-events:none;z-index:2}
.agent-highlight{background:var(--accent-soft);border-radius:4px;padding:1px 4px;color:var(--accent);font-weight:600}
:root[data-theme="dark"] .agent-highlight{color:#d9f8e9}
/* Главный экран: компактные фильтры и лидеры выбранного периода */
.home-strip{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(0,1fr);gap:10px;align-items:stretch}
.home-strip .fbox{min-width:0}
.home-strip .fbox .filters{gap:9px;min-height:166px;justify-content:space-between}
.home-strip .fbox .row{gap:6px}
.home-strip .fbox .lbl{min-width:79px;font-size:14px}
.home-strip #periods{flex-wrap:wrap;gap:5px}
.home-strip #periods .chip{padding:6px 10px;font-size:14px;white-space:nowrap;line-height:1.35}
.home-strip #companies{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.home-strip .company-row #companies .chip{padding:6px 11px;font-size:14px;white-space:nowrap}
.home-strip .employee-row{margin-top:3px;gap:9px}
.home-strip .employee-row #empBtn{padding:7px 12px;font-size:14px;white-space:nowrap}
.home-strip .employee-row label.chip{display:inline-flex;gap:7px;align-items:center;padding:6px 12px;font-size:14px;white-space:nowrap}
.home-strip .reset-row{justify-content:flex-end;margin-top:auto}
.home-strip #reset{font-size:13px;padding:7px 12px;white-space:nowrap}
@media(max-width:800px){.home-strip .fbox .filters{min-height:0}.home-strip #periods{flex-wrap:wrap}.home-strip .employee-row label.chip{white-space:normal}}
.leaderboard{position:relative;overflow:hidden;min-width:0;isolation:isolate;border-radius:15px;border:1px solid #5eaa8b;padding:13px 13px 12px;background:radial-gradient(ellipse at 85% 14%,rgba(233,247,214,.49) 0%,transparent 43%),radial-gradient(ellipse at 18% 82%,rgba(54,151,119,.24) 0%,transparent 50%),linear-gradient(125deg,#318a69 0%,#54a888 53%,#428f73 100%);box-shadow:0 2px 8px rgba(21,91,49,.12);color:white}
.leaderboard:before{content:"";position:absolute;inset:-40px -30px auto 28%;height:100px;border-radius:50%;background:linear-gradient(110deg,transparent,rgba(240,251,220,.27));transform:rotate(-8deg);z-index:-1}
.leaderboard:after{content:"✦  ❧";position:absolute;right:14px;top:6px;font-size:26px;color:#f6db65;opacity:.78;pointer-events:none}
.leaderboard h2{color:#fff;font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 1px rgba(0,0,0,.18)}
.leaderboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.leaderboard-column{min-width:0;border-radius:12px;padding:8px 5px;background:rgba(255,255,255,.94);color:#17221a;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.leaderboard-column h3{font-size:11px;line-height:1.2;margin:0 0 7px;min-height:26px;display:flex;align-items:center;gap:4px}
.leaderboard-row{display:grid;grid-template-columns:19px minmax(0,1fr) auto;gap:4px;align-items:center;padding:5px 2px;margin:2px 0;border-radius:8px;font-size:10px;line-height:1.25}
.leaderboard-row .place{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;font-weight:800;font-size:11px}
.leaderboard-row .leader-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:1.25;font-weight:600}
.leaderboard-row .leader-count{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.leaderboard-row.gold{background:linear-gradient(90deg,#ffe49a,#fff3ce);font-weight:750}
.leaderboard-row.gold .place{background:#f4bc29;color:#513700}
.leaderboard-row.silver{background:#e9eef1}
.leaderboard-row.silver .place{background:#b5c2cd;color:#35434c}
.leaderboard-row.bronze{background:#f4f0eb;color:#635c55}
.leaderboard-row.bronze .place{background:#d8bdab;color:#6b5446}
.leaderboard-empty{font-size:12px;color:#385342;padding:12px 5px}
.employee-idle td{background:#eeeff0!important;color:#73787b}
.employee-idle .muted{color:#91979a}
.employee-idle:hover td{background:#e4e7e9!important}
.employee-more{margin:9px 0 4px}
.employee-more>summary{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);padding:7px 12px;width:max-content;max-width:100%;font-weight:600}
.employee-more[open]>summary{margin-bottom:8px}
@media(max-width:1100px){.home-strip{grid-template-columns:1fr}.leaderboard-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.leaderboard-column h3{min-height:0}}
@media(max-width:600px){.leaderboard-grid{grid-template-columns:1fr}.leaderboard-row{font-size:12px}.leaderboard-column h3{font-size:12px}}
/* Kufar Demand v1 — matched to Realt Demand, with phone-opening analysis. */
#tabs .tab[data-tab="demand"]{background:#f9eaec;color:#96505a;border:1px solid #edd5d9;font-weight:700}
#tabs .tab[data-tab="demand"]:hover{background:#f2dfe3;color:#873e4b}
#tabs .tab[data-tab="demand"][aria-selected="true"]{background:#ae5965;color:#fff;border-color:#ae5965}
#tabs .tab[data-tab="demand"]:focus-visible{outline:2px solid #c97883;outline-offset:2px}
.dem-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.dem-head{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.dem-head h2{font-size:23px;margin:0 0 3px}
.dem-head p{font-size:14px;margin:0;color:var(--ink-2)}
.dem-controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 17px;grid-template-areas:"period group" "mode metric";padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.dem-control{display:flex;align-items:center;gap:12px;min-width:0}
.dem-control>span{font-size:13px;font-weight:650;flex:0 0 75px}
.dem-period{grid-area:period}.dem-group{grid-area:group}.dem-mode{grid-area:mode}.dem-metric{grid-area:metric}
.dem-chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dem-chip{font-size:13px;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:34px}
.dem-chip.is-on{background:#285b78;color:white;border-color:#285b78}
.dem-chip:not(.is-on):hover{background:#e1edf2;color:#234e68}
.dem-chip:focus-visible,.dem-expand:focus-visible{outline:2px solid #7ea7c7;outline-offset:2px}
.dem-custom{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding-left:86px}
.dem-custom label{display:flex;align-items:center;gap:6px;font-size:13px}

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Радар новостроек</h1>
      <div class="sub">Кто разместил объявления, что получило внимание и когда открывали номер.</div>
    </div>
    <span class="pill" id="status">Загрузка…</span>
  </header>

  <div class="home-strip">
  <details class="panel fbox" id="fbox" open><summary><span>Фильтры</span><span class="muted" id="fsum"></span></summary><section class="filters" aria-label="Фильтры">
    <div class="row" id="periods"></div>
    <div class="row" id="customRow" hidden>
      <span class="lbl">Свой период</span>
      <input type="date" id="dFrom"> — <input type="date" id="dTo">
    </div>
    <div class="row company-row">
      <span class="lbl">Компания</span>
      <span id="companies"></span>
    </div>
    <div class="row employee-row">
      <span class="lbl">Сотрудники</span>
      <div class="emp-box">
        <button class="btn" id="empBtn" aria-expanded="false">Все сотрудники ▾</button>

      </div>
      <label class="chip"><input type="checkbox" id="newOnly" checked> только новостройки</label>
    </div>

  </section></details>
  <aside class="leaderboard" aria-label="Лидеры за выбранный период">
    <h2>🏆 Лидеры за период</h2>
    <div id="periodLeaders" class="leaderboard-grid"><div class="leaderboard-empty">Загружаю результаты…</div></div>
  </aside>
  </div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"><div class="center">Загружаю данные…</div></main>
</div>
<div class="tip" id="tip"></div>
<div class="drawer" id="drawer"><div class="in" id="drawerIn"></div></div>

<script>
"use strict";
const KEY = new URLSearchParams(location.search).get("k") || "";
const TZ_OFF = 3 * 3600 * 1000; // Минск, UTC+3
const NIGHT = 24, SPREAD = 25;
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const EV_NAMES = {new:"Новое", gone:"Снято", back:"Вернулось", raise:"Поднятие", price:"Цена", promo_hl:"Выделение", promo_pp:"Закреп вверху", promo_rb:"Ленточка", title:"Заголовок", photo:"Обложка"};
const TABS = [["promo","Продвижение"],["ads","Объявления за период"],["employees","Сотрудники"],["hours","По часам"],["placed","Что размещают"],["organic","Топ органика"],["promoted","Топ продвижение"],["demand","Спрос"]];

let CAT = null, CUBE = null, STATUS = null;
const S = { period:"today", from:"", to:"", wd:new Set(), company:"all", emps:new Set(), rooms:new Set(), q:"", newOnly:true, tab:"employees", sort:{}, limit:60 };

const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("ru-RU");
const fmtS = n => n >= 1e6 ? fmt1(n/1e6)+" млн" : n >= 1e4 ? fmt1(n/1e3)+" тыс" : fmt(n);
const fmt1 = n => n == null || !isFinite(n) ? "—" : n.toLocaleString("ru-RU",{maximumFractionDigits:1});
const pct = (a,b) => b ? (100*a/b).toLocaleString("ru-RU",{maximumFractionDigits:1})+"%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayStr = ms => new Date(ms + TZ_OFF).toISOString().slice(0,10);
const todayStr = () => dayStr(Date.now());
const addDays = (d, n) => dayStr(Date.parse(d+"T00:00:00Z") - TZ_OFF + n*86400000 + 12*3600000);
const wdOf = d => (new Date(d+"T12:00:00Z").getUTCDay() + 6) % 7;
const dtLocal = ts => { if(!ts) return "—"; const d = new Date(ts*1000+TZ_OFF); return d.toISOString().slice(8,10)+"."+d.toISOString().slice(5,7)+" "+d.toISOString().slice(11,16); };
const hourOfTs = ts => new Date(ts*1000+TZ_OFF).getUTCHours();
const dayOfTs = ts => dayStr(ts*1000);
let EUR_RATE = 0.86;
const eur = a => a ? (a.pe || (a.pu ? Math.round(a.pu*EUR_RATE) : null)) : null;
const roomKey = r => { const n = parseInt(r,10); return !n ? "?" : n >= 4 ? "4+" : String(n); };

async function getJSON(name){
  const r = await fetch(`/d/${name}?k=${encodeURIComponent(KEY)}`, {cache:"no-store"});
  if(!r.ok) throw new Error(name+": "+r.status);
  return r.json();
}

// ---------- сотрудники
function empKey(a){ return a.pid ? "p:"+a.pid : a.cn ? "c:"+a.cn : "u"; }
function empName(key){
  if(key === "u") return "Не определён";
  if(key.startsWith("p:")){ const p = CAT.profiles[key.slice(2)]; return (p && p.name) ? p.name : "Профиль "+key.slice(2); }
  return key.slice(2)+" (не подтверждён)";
}
function empCompany(key){
  if(key.startsWith("p:")){ const p = CAT.profiles[key.slice(2)]; return p ? p.company : ""; }
  return "";
}

// ---------- фильтры
function periodDays(){
  const t = todayStr();
  let from, to = t;
  if(S.period === "today") from = t;
  else if(S.period === "yesterday"){ from = addDays(t,-1); to = from; }
  else if(S.period === "custom"){ from = S.from || t; to = S.to || t; }
  else if(S.period === "all"){ const ks = Object.keys(CUBE.days).sort(); from = ks[0] || t; }
  else from = addDays(t, -(parseInt(S.period,10)-1));
  if(from > to) [from, to] = [to, from];
  const out = [];
  for(let d = from; d <= to; d = addDays(d,1)){ out.push(d); if(out.length > 400) break; }
  return out;
}
function adOk(id, a){
  if(!a) return false;
  if(S.newOnly && !a.nw) return false;
  if(S.company !== "all" && a.c !== S.company) return false;
  if(S.emps.size && !S.emps.has(empKey(a))) return false;
  return true;
}
function vhOk(pid, rooms){
  if(S.emps.size && !S.emps.has("p:"+pid)) return false;
  if(S.company !== "all"){ const p = CAT.profiles[pid]; if(!p || p.company !== S.company) return false; }
  return true;
}

// ---------- фильтр робота
// Робот каждый день обходит объявления и в каждом один раз открывает страницу и номер.
// На объявлениях, размещённых раньше этого дня, одно «+1 просмотр, +1 открытие» в день считаем роботом.
function removeRobot(){
  for(const [d,D] of Object.entries(CUBE.days)){
    const start = Date.parse(d+"T00:00:00+03:00")/1000;
    D.bot = {};
    for(const id in (D.a||{})){
      const a = CAT.ads[id]; if(!a) continue;
      const placed = a.lt0 || a.fs || a.lt;
      const [v,p] = D.a[id];
      if(!placed || placed >= start || v < 1 || p < 1) continue;
      D.a[id] = [v-1, p-1]; D.bot[id] = 1;
      const ph = (D.ph||[]).find(x => x[0]===id && x[2] > 0);
      if(ph){
        ph[2]--;
        const vh = (D.vh||[]).find(x => x[0]===(a.pid||"") && String(x[1])===String(a.r||"") && x[2]===ph[1] && x[3] > 0);
        if(vh) vh[3]--;
      }
    }
  }
}

// первый день, когда радар замерял весь день (до него — данные старой базы)
function radarStart(){ return Object.keys(CUBE.days).sort().find(d => (CUBE.days[d].runs||[]).length >= 10) || "9999"; }

// ---------- агрегирование выбранного периода
function aggregate(){
  const days = periodDays();
  const ads = CAT.ads;
  const per = new Map();   // id -> {dv,dp,ev:[]}
  const byDay = [];        // [{d,dv,dp}]
  const phHour = new Array(26).fill(0), vHour = new Array(26).fill(0);
  const heat = Array.from({length:7}, () => new Array(24).fill(0));
  const heatV = Array.from({length:7}, () => new Array(24).fill(0));
  const events = [];
  const covHour = new Array(26).fill(0);
  const ok = id => adOk(id, ads[id]);
  let bot = 0;
  for(const d of days){
    const D = CUBE.days[d]; let dv = 0, dp = 0;
    if(D){
      for(const id in D.a){ if(!ok(id)) continue; const [v,p] = D.a[id]; dv += v; dp += p;
        const x = per.get(id) || {dv:0,dp:0,ev:[]}; x.dv += v; x.dp += p; per.set(id,x); }
      for(const [id,h,n] of D.ph){ if(!ok(id)) continue; phHour[h] += n; if(h < 24) heat[wdOf(d)][h] += n; }
      for(const [pid,r,h,n] of D.vh){ if(!vhOk(pid,r)) continue; vHour[h] += n; if(h < 24) heatV[wdOf(d)][h] += n; }
      for(const e of D.ev){ if(!ok(e[1])) continue; events.push(e); const x = per.get(e[1]) || {dv:0,dp:0,ev:[]}; x.ev.push(e); per.set(e[1], x); }
      for(const h in (D.cov||{})) covHour[h] += D.cov[h];
      for(const id in (D.bot||{})) if(ok(id)) bot++;
    }
    byDay.push({d, dv, dp});
  }
  return {days, per, byDay, phHour, vHour, heat, heatV, events, covHour, bot};
}

// ---------- графики (SVG)
function barChart(values, labels, cls, opts={}){
  const W = opts.w || (innerWidth < 640 ? 360 : 560), H = opts.h || (innerWidth < 640 ? 200 : 190), pl = 44, pb = 22, pt = 8;
  const ghost = opts.ghost || (() => false);
  const max = Math.max(1, ...values.filter((v,i) => !ghost(i)));
  const n = values.length, bw = (W-pl-6)/n, gap = Math.min(4, bw*0.25);
  const nice = niceMax(max), ticks = [0, nice/2, nice];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title||"")}">`;
  for(const t of ticks){ const y = pt + (H-pt-pb)*(1-t/nice); s += `<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmtS(t)}</text>`; }
  values.forEach((v,i) => {
    const h = (H-pt-pb)*Math.min(v, nice)/nice, x = pl + i*bw + gap/2, y = H-pb-h, w = Math.max(1,bw-gap);
    const c = (opts.special && opts.special(i)) ? "bar-x" : cls;
    if(ghost(i)){ if(v > 0) s += `<rect class="ghost" x="${x+1}" y="${y+1}" width="${w-2}" height="${Math.max(0,h-1)}" rx="3" data-tip="${esc(labels[i])}: ${fmt(v)}"/><text x="${x+w/2}" y="${Math.max(pt+9,y-3)}" text-anchor="middle" class="gl">${fmtS(v)}</text>`; }
    else if(v > 0) s += `<path class="${c}" d="${roundTop(x,y,w,h)}" data-tip="${esc(labels[i])}: ${fmt(v)}"/>`;
    s += `<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent" data-tip="${esc(labels[i])}: ${fmt(v)}"/>`;
    const every = Math.ceil(n/(innerWidth < 640 ? 9 : 14));
    if(i % every === 0) s += `<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(opts.short ? opts.short(i) : labels[i])}</text>`;
  });
  return s + `</svg>`;
}
function roundTop(x,y,w,h){ const r = Math.min(4, w/2, h); return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`; }
function niceMax(m){ const p = Math.pow(10, Math.floor(Math.log10(m))); for(const k of [1,2,2.5,5,10]) if(k*p >= m) return k*p; return 10*p; }

function heatmap(grid, title){
  const H0 = 8;
  const max2 = Math.max(1, ...grid.flatMap(r => r.slice(H0)));
  let s = `<div style="overflow-x:auto"><div class="heat" style="grid-template-columns:28px repeat(${24-H0},minmax(26px,1fr));min-width:520px" role="table" aria-label="${esc(title)}"><div></div>`;
  for(let h=H0; h<24; h++) s += `<div class="hd">${h}</div>`;
  grid.forEach((row,w) => {
    s += `<div class="hd" style="text-align:left">${WD[w]}</div>`;
    row.slice(H0).forEach((v,i) => { const h = i + H0; const max = max2; const lvl = v ? Math.min(4, Math.ceil(4*v/max)) : 0;
      s += `<div class="c" style="background:var(--heat-${lvl});${lvl>=3?"color:#fff":""}" data-tip="${WD[w]}, ${h}:00–${h+1}:00 — ${fmt(v)}">${v ? fmt(v) : ""}</div>`; });
  });
  return s + `</div></div>`;
}

// ---------- представления
function kpi(v,k,h){ return `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div>${h?`<div class="h">${h}</div>`:""}</div>`; }

function viewOverview(A){
  const ads = CAT.ads;
  let dv=0, dp=0; for(const x of A.per.values()){ dv += x.dv; dp += x.dp; }
  const active = Object.entries(ads).filter(([id,a]) => a.act && adOk(id,a)).length;
  const cnt = t => A.events.filter(e => e[2] === t).length;
  const promoOn = A.events.filter(e => e[2].startsWith("promo_") && e[4]).length;
  const labels = A.byDay.map(x => x.d.slice(8,10)+"."+x.d.slice(5,7));
  const r0 = radarStart(), oldDb = i => A.byDay[i].d < r0, hasOld = A.byDay.some((x,i) => oldDb(i));
  return `<div class="kpis">
    ${kpi(fmt(dv),"Прирост просмотров","за выбранный период")}
    ${kpi(fmt(dp),"Открытий номера","не звонки — Kufar считает показы телефона")}
    ${kpi(pct(dp,dv),"Открытий на просмотр","конверсия просмотра в открытие номера")}
    ${kpi(fmt(active),"Активных сейчас","по последнему обходу")}
    ${kpi(fmt(cnt("new")),"Новых объявлений","за период")}
    ${kpi(fmt(cnt("raise")),"Поднятий","смена даты размещения")}
    ${kpi(fmt(promoOn),"Включений продвижения","выделение, закреп, ленточки")}
  </div>
  <div class="grid2">
    <div class="panel"><h2>Прирост просмотров по дням</h2>${barChart(A.byDay.map(x=>x.dv), labels, "bar-v", {title:"Просмотры по дням", special:oldDb})}</div>
    <div class="panel"><h2>Открытия номера по дням</h2>${barChart(A.byDay.map(x=>x.dp), labels, "bar-p", {title:"Открытия номера по дням", special:oldDb})}</div>
  </div>
  ${hasOld ? `<p class="note">Серые столбцы — дни до ${r0.slice(8,10)}.${r0.slice(5,7)} из старой базы. Старый монитор замерял только часть объявлений, поэтому эти дни ниже примерно в 2 раза. Сравнивайте дни внутри одного цвета.</p>` : ""}
${A.bot ? `<p class="note robot">🤖 <b>Отфильтровано как робот: ${fmt(A.bot)} открытий номера и ${fmt(A.bot)} просмотров</b> на объявлениях, размещённых раньше. Программа каждый день обходит объявления и в каждом один раз открывает номер — такие открытия в цифры выше не входят.</p>` : ""}
  <p class="note">Данные собираются каждые 30 минут с 8:00 до 0:00 по Минску. Прирост за ночь виден утром отдельной строкой во вкладке «По часам».</p>`;
}

function sortRows(rows, tab, def){
  const st = S.sort[tab] || def;
  const k = st.key, dir = st.dir;
  rows.sort((x,y) => { const a = x[k] ?? -Infinity, b = y[k] ?? -Infinity; return (a > b ? 1 : a < b ? -1 : 0) * dir; });
  return rows;
}
function th(tab, key, label, num){
  const st = S.sort[tab]; const mark = st && st.key === key ? (st.dir > 0 ? " ▲" : " ▼") : "";
  return `<th class="${num?"num":""}" data-sort="${tab}:${key}">${label}${mark}</th>`;
}

// ---------- карточки объявлений
function adRows(A, onlyWithActivity){
  const ads = CAT.ads, rows = [], days = new Set(A.days);
  const ids = onlyWithActivity ? [...A.per.keys()] : Object.keys(ads).filter(id => adOk(id, ads[id]) && (ads[id].act || A.per.has(id)));
  for(const id of ids){
    const a = ads[id]; if(!a || !adOk(id,a)) continue;
    const x = A.per.get(id) || {dv:0,dp:0,ev:[]};
    const raises = x.ev.filter(e => e[2]==="raise").length;
    let promoDays = 0; for(const d of days){ const D = CUBE.days[d]; if(D && D.pr && D.pr[id]) promoDays++; }
    const promoEv = x.ev.some(e => e[2].startsWith("promo_") && e[4]);
    const placed = a.lt0 || a.lt || a.fs;
    rows.push({id, a, dv:x.dv, dp:x.dp, conv: x.dv ? x.dp/x.dv : 0, raises, promoDays, promo: promoDays>0 || promoEv,
      emp: empName(empKey(a)), ppm: eur(a) && a.a ? eur(a)/a.a : null, placed,
      lastRaise: a.lt && placed && a.lt - placed > 600 ? a.lt : null, area:a.a||0, price:eur(a)||0});
  }
  return rows;
}
let FAST = null;
function fastStart(){
  if(FAST) return FAST;
  const first = new Map(), dps = [], dvs = [], keys = Object.keys(CUBE.days).sort(), first0 = keys[0];
  for(const [id,a] of Object.entries(CAT.ads)){
    const t = a.lt0 || a.fs; if(!t) continue; const d0 = dayOfTs(t); if(!first0 || d0 <= first0) continue;   // размещено до начала истории — первых суток не видно
    const d1 = addDays(d0,1); let v = 0, p = 0;
    for(const d of [d0,d1]){ const x = CUBE.days[d] && CUBE.days[d].a[id]; if(x){ v += x[0]; p += x[1]; } }
    first.set(id,[v,p]); dvs.push(v); dps.push(p);
  }
  const q = (arr, k) => { if(!arr.length) return Infinity; const s = [...arr].sort((a,b)=>a-b); return s[Math.min(s.length-1, Math.floor(s.length*k))]; };
  FAST = {first, dpT: Math.max(3, q(dps, .85)), dvT: Math.max(40, q(dvs, .9))};
  return FAST;
}

  const sorted = rows.slice().sort((x,y) => val(y,key)-val(x,key) || val(y,other)-val(x,other));

function renderPeriodLeaders(A){
  // Размещения — новые объявления периода; просмотры/открытия — по всем объявлениям в выбранном периоде.
  const created=new Set(A.events.filter(e=>e[2]==="new").map(e=>e[1]));
  const m=new Map();
  const get=a=>{
    const k=empKey(a);
    if(!k.startsWith("p:"))return null;
    if(!m.has(k))m.set(k,{k,name:empName(k),newc:0,nv:0,np:0});
    return m.get(k);
  };
  for(const id of created){const a=CAT.ads[id];if(!adOk(id,a))continue;const x=get(a);if(x)x.newc++;}
  for(const [id,v] of A.per){const a=CAT.ads[id];if(!adOk(id,a))continue;const x=get(a);if(x){x.nv+=v.dv;x.np+=v.dp;}}
  const people=[...m.values()];
  const metrics=[["newc","📣 По количеству объявлений"],["nv","👁 По просмотрам"],["np","☎ По открытиям номера"]];
  const classNames=["gold","silver","bronze"];
  $("#periodLeaders").innerHTML=metrics.map(([key,title])=>{
    const ordered=people.filter(x=>x[key]>0).sort((a,b)=>b[key]-a[key]||b.newc-a.newc||a.name.localeCompare(b.name,"ru")).slice(0,3);
    const rows=ordered.length?ordered.map((x,i)=>`<div class="leaderboard-row ${classNames[i]}" title="${esc(x.name)}"><span class="place">${i+1}</span><span class="leader-name">${esc(x.name)}</span><span class="leader-count">${fmt(x[key])}</span></div>`).join(""):'<div class="leaderboard-empty">Нет результатов за период</div>';
    return `<section class="leaderboard-column"><h3>${title}</h3>${rows}</section>`;
  }).join("");
}

// Kufar Radar — Demand UI module, 2026-11-09.
// Front-end only. Uses existing CAT/CUBE daily increments AFTER removeRobot().
// Do not confuse openings of the phone number with calls or unique leads.
const DEM={period:"today",mode:"all",group:"exact",metric:"views",from:"",to:"",opened:null,shown:40};
const DEM_AREA=[0,30,35,40,45,50,55,60,65,70,75,80,90,100,120,140,160,180,200,250,300,Infinity];
const DEM_PRICE=[0,45000,50000,55000,60000,65000,70000,80000,90000,100000,120000,140000,160000,180000,200000,250000,300000,400000,500000,750000,Infinity];
function demDates(){
 const today=todayStr();let from=today,to=today;
 if(DEM.period==="yesterday")from=to=addDays(today,-1);
 else if(DEM.period==="custom"){from=DEM.from||addDays(today,-6);to=DEM.to||today;}
 else if(/^\d+$/.test(DEM.period))from=addDays(today,-Math.min(90,Number(DEM.period))+1);
 const recorded=Object.keys(CUBE.days).sort(),first=recorded[0]||today,last=recorded.at(-1)||today;
 const days=[];
 if(from<=to)for(let d=from;d<=to&&days.length<120;d=addDays(d,1))if(CUBE.days[d])days.push(d);
 return {from,to,days,first,last};
}
function demPrice(a){
 const euro=Number(a.pe),usd=Number(a.pu);
 if(euro>0&&Number.isFinite(euro))return {value:Math.round(euro*100)/100,currency:"€"};
 if(usd>0&&Number.isFinite(usd))return {value:Math.round(usd*100)/100,currency:"$"};
 return null;
}
function demBand(n,edges){
 for(let i=0;i<edges.length-1;i++)if(n>=edges[i]&&n<edges[i+1])return {low:edges[i],high:edges[i+1]};
 return null;
}
function demDescriptor(a){
 const area=Number(a.a),price=demPrice(a);
 if(DEM.group==="area"){
  if(!(area>0))return null;
  const b=demBand(area,DEM_AREA);return b&&{key:"area|"+b.low,group:"area",...b};
 }
 if(!price)return null;
 if(DEM.group==="price"){
  const edges=DEM_PRICE;
  const b=demBand(price.value,edges);
  return b&&{key:"price|"+price.currency+"|"+b.low,group:"price",currency:price.currency,...b};
 }
 if(!(area>0))return null;
 const exactArea=Math.round(area*100)/100;
 return {key:"exact|"+exactArea+"|"+price.value.toFixed(2)+"|"+price.currency,group:"exact",area:exactArea,price:price.value,currency:price.currency};
}
function demLabel(g){
 const n=x=>fmt1(x);
 if(g.group==="exact")return n(g.area)+" м² · "+n(g.price)+" "+g.currency;
 const units=g.group==="area"?" м²":" тыс. "+g.currency;
 const scaled=x=>g.group==="area"?fmt(x):fmt(x/1000);
 return (g.low===0?"до "+scaled(g.high):g.high===Infinity?"от "+scaled(g.low):scaled(g.low)+"–"+scaled(g.high))+units;
}
function demPaid(day,id,views,opens){
 const e=day.pe&&day.pe[id];
 let pv=0,pp=0;
 if(e&&typeof e==="object"){
  for(const x of Object.values(e))if(Array.isArray(x)){pv+=Math.max(0,Number(x[0])||0);pp+=Math.max(0,Number(x[1])||0);}
 }else if(day.pr&&day.pr[id]){pv=views;pp=opens;}
 return [Math.min(views,pv),Math.min(opens,pp)];
}
function demAggregate(){
 const period=demDates(),byId=new Map(),counts={unknown:0,days:period.days.length};
 for(const day of period.days){
  const D=CUBE.days[day];
  for(const [id,raw]of Object.entries(D.a||{})){
   const ad=CAT.ads[id];if(!ad||!adOk(id,ad))continue;
   let views=Math.max(0,Number(raw[0])||0),opens=Math.max(0,Number(raw[1])||0);
   const paid=demPaid(D,id,views,opens);
   if(DEM.mode==="paid"){views=paid[0];opens=paid[1];}
   else if(DEM.mode==="free"){views-=paid[0];opens-=paid[1];}
   if(!views&&!opens)continue;
   let item=byId.get(id);
   if(!item){item={id,a:ad,dv:0,dp:0};byId.set(id,item);}
   item.dv+=views;item.dp+=opens;
  }
 }
 const groups=new Map();
 for(const item of byId.values()){
  const descr=demDescriptor(item.a);
  if(!descr){counts.unknown++;continue;}
  let g=groups.get(descr.key);
  if(!g){g={...descr,views:0,opens:0,items:new Map()};groups.set(descr.key,g);}
  g.views+=item.dv;g.opens+=item.dp;g.items.set(item.id,item);
 }
 const records=[...groups.values()].map(g=>({...g,count:g.items.size,ratio:g.views?100*g.opens/g.views:null}));
 records.sort((a,b)=>demValue(b)-demValue(a)||b.opens-a.opens||b.views-a.views||a.key.localeCompare(b.key,"ru"));
 return {period,records,unpriced:counts.unknown,ids:new Set(records.flatMap(g=>[...g.items.keys()]))};
}
function demValue(x){
 if(DEM.metric==="opens")return x.opens;
 if(DEM.metric==="ratio")return x.views>=20?100*x.opens/x.views:-1;
 return x.views;
}
function demPareto(records){
 const total=records.reduce((v,g)=>v+(DEM.metric==="views"?g.views:g.opens),0);
 let seen=0,count=0;const ads=new Set();
 if(DEM.metric!=="ratio"&&total>0)for(const g of records){
  if(seen>=total*.8)break;
  count++;seen+=DEM.metric==="views"?g.views:g.opens;
  for(const id of g.items.keys())ads.add(id);
 }
 return {total,count,ads:ads.size,share:total?100*seen/total:0};
}
function demCards(g){
 const value=x=>DEM.metric==="opens"?x.dp:DEM.metric==="ratio"?(x.dv>=10?100*x.dp/x.dv:-1):x.dv;
 return [...g.items.values()].sort((a,b)=>value(b)-value(a)||b.dp-a.dp||b.dv-a.dv||String(a.id).localeCompare(String(b.id),"ru")).slice(0,30).map(x=>{
  const a=x.a,placed=a.lt0||a.fs||a.lt;
  return adCard({id:x.id,a,dv:x.dv,dp:x.dp,emp:empName(empKey(a)),placed,lastRaise:a.lt&&placed&&a.lt-placed>600?a.lt:null,raises:0},null,{plus:true,total:true});
 }).join("");
}

 return '<button type="button" class="dem-chip'+(current===value?' is-on':'')+'" data-dem-'+attr+'="'+esc(value)+'" aria-pressed="'+(current===value?'true':'false')+'">'+esc(label)+'</button>';
}

function viewDemand(){
 const data=demAggregate(),{period,records,ids}=data,pareto=demPareto(records);
 const totalV=records.reduce((sum,g)=>sum+g.views,0),totalP=records.reduce((sum,g)=>sum+g.opens,0);
 const base=DEM.metric==="views"?"просмотров":"открытий";
 const available=period.days.length?period.days[0]+" — "+period.days.at(-1):"нет данных";
 const coverage=period.from<period.first||period.to>period.last?' · доступная история: '+period.first+" — "+period.last:"";
 const pref=DEM.metric==="ratio"?'Для сравнения доли открытий в группе нужно не менее 20 просмотров. ':"";
 const note='Период: '+period.from+' — '+period.to+' · учтены дни: '+fmt(period.days.length)+' ('+available+').'+coverage
 +' Вычтены обнаруженные роботизированные открытия номера. Цена берётся из текущей карточки, её прошлые изменения не восстановлены. '+pref
 +(data.unpriced?' Не хватает площади или цены для группировки: '+fmt(data.unpriced)+' объявлений.':'');
 const kpi=(value,label,sub)=>'<div class="dem-kpi"><b>'+esc(value)+'</b><span>'+esc(label)+'</span><small>'+esc(sub)+'</small></div>';
 const ratio=totalV?(100*totalP/totalV).toLocaleString("ru-RU",{maximumFractionDigits:1})+'%':"—";
 let stats='<div class="dem-stats">'
 +kpi(fmt(totalV),"Просмотры за период","Прирост после фильтра")
 +kpi(fmt(totalP),"Открытий номера","Это не количество звонков")
 +kpi(ratio,"Открытий / просмотров","Относительный показатель")
 +kpi(fmt(ids.size),"Объявлений",fmt(records.length)+" групп предложений")
 +kpi(DEM.metric==="ratio"?"—":pareto.share.toLocaleString("ru-RU",{maximumFractionDigits:1})+'%',"Группы, дающие 80%",DEM.metric==="ratio"?"80/20 неприменимо к доле":fmt(pareto.count)+" групп · "+fmt(pareto.ads)+" объявлений")
 +'</div>';
 const top=records.slice(0,12),max=Math.max(1,...top.map(g=>Math.max(0,demValue(g))));
 const chartHead='<div class="dem-chart-head"><span>Диапазон / предложение</span><span>Интерес по группам</span><span>Показатель</span></div>';
 let chart=top.map((g,i)=>{
  const score=demValue(g),len=score>=0?Math.max(0,score/max)*100:0;
  const col='rgb('+Math.round(145+i*5)+','+Math.round(190+i*3.2)+','+Math.round(216+i*2.2)+')';
  const value=DEM.metric==="ratio"?(score<0?"—":score.toLocaleString("ru-RU",{maximumFractionDigits:1})+'%'):fmt(score);
  const label=DEM.metric==="ratio"?" просмотров / "+fmt(g.opens)+" открытий":' объявлений';
  return '<div class="dem-chart-row"><div class="dem-chart-label"><b>'+esc(demLabel(g))+'</b><small>'+fmt(g.count)+label+'</small></div><div class="dem-track"><div class="dem-fill" style="width:'+len.toFixed(2)+'%;background:'+col+'"></div></div><strong>'+esc(value)+'</strong></div>';
 }).join('');
 const title=DEM.group==="exact"?"Интерес к сочетаниям площади и цены":DEM.group==="area"?"Интерес по диапазонам площади":"Интерес по диапазонам стоимости";
 const summary=DEM.metric==="ratio"?"Рейтинг по доле открытий; показатель 80/20 не применяется к процентам.":'80% '+base+' обеспечивают '+fmt(pareto.count)+' из '+fmt(records.length)+' групп ('+pct(pareto.count,records.length)+').';
 const rows=records.slice(0,DEM.shown).flatMap((g,i)=>{
  const key=g.key,open=DEM.opened===key,score=demValue(g);
  const fraction=DEM.metric==="ratio"?"—":pct(DEM.metric==="views"?g.views:g.opens,pareto.total);
  const rate=g.views?(100*g.opens/g.views).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%':"—";
  const button='<button type="button" class="dem-expand" data-dem-expand="'+esc(key)+'" aria-expanded="'+open+'">'+(open?'Свернуть':'Топ-'+Math.min(30,g.count)+' с фото')+' ▾</button>';
  const row='<tr><td>'+(i+1)+'</td><td><b>'+esc(demLabel(g))+'</b></td><td class="num">'+fmt(g.count)+'</td><td class="num">'+fmt(g.views)+'</td><td class="num">'+fmt(g.opens)+'</td><td class="num">'+rate+'</td><td>'+button+'</td></tr>';
  if(!open)return [row];
  const gallery='<tr class="dem-gallery-row"><td colspan="7"><div class="dem-gallery-title"><b>'+esc(demLabel(g))+' · топ-'+Math.min(30,g.count)+'</b><span>Отсортировано по '+(DEM.metric==="views"?"просмотрам":DEM.metric==="opens"?"открытиям номера":"доле открытий")+' за период</span></div><div class="cgrid dem-gallery">'+demCards(g)+'</div></td></tr>';
  return [row,gallery];
 });
 const table=records.length?'<div class="tbl-wrap dem-table-wrap"><table><thead><tr><th>№</th><th>Группа</th><th>Объявлений</th><th>Просмотры</th><th>Открытия</th><th>На 100 просм.</th><th>Карточки</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>':'<p class="note">За выбранный период нет подтверждённых данных для анализа.</p>';
 const more=records.length>DEM.shown?'<button class="btn dem-more" data-dem-more="1">Показать ещё '+fmt(Math.min(40,records.length-DEM.shown))+' групп</button>':'';
 return '<div class="dem-panel">'+demHeader()+'<p class="dem-note">'+esc(note)+'</p>'+stats
 +'<div class="dem-section-title"><h3>'+esc(title)+'</h3><span>'+esc(summary)+'</span></div>'
 +(top.length?'<div class="dem-chart">'+chartHead+chart+'</div>':'<p class="note">Нет данных.</p>')
 +'<details class="dem-details" open><summary>Подробная таблица групп · '+fmt(records.length)+'</summary>'+table+more+'</details>'
 +'<p class="dem-note">Просмотры и открытия номера — прибавка счётчиков Kufar, а не уникальные люди. Для органики и продвижения используются раздельные показатели за дни, когда статус известен. Показатель «открытий / просмотров» нельзя считать подтверждённой долей позвонивших.</p></div>';
}

// ---------- отрисовка
function render(){
  const A = aggregate();
  const V = {overview:viewOverview, ads:viewAds, employees:viewEmployees, hours:viewHours, promo:()=>viewPromo(), placed:viewPlaced, organic:A=>viewTop(A,"organic"), promoted:A=>viewTop(A,"promo"), demand:()=>viewDemand()}[S.tab];
  $("#view").innerHTML = V(A);
  renderControls();
  renderPeriodLeaders(A);
}
function renderControls(){
  const P = [["today","Сегодня"],["yesterday","Вчера"],["7","7 дней"],["30","30 дней"],["90","90 дней"],["all","Всё время"],["custom","Свой период"]];
  $("#periods").innerHTML = `<span class="lbl">Период</span>` + P.map(([k,l]) => `<button class="chip" data-period="${k}" aria-pressed="${S.period===k}">${l}</button>`).join("");
  $("#customRow").hidden = S.period !== "custom";
  $("#companies").innerHTML = [["all","Все"], ...Object.entries(CAT.companies)].map(([k,l]) => `<button class="chip" data-company="${k}" aria-pressed="${S.company===k}">${esc(l)}</button>`).join(" ");
  $("#tabs").innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  const P2 = Object.fromEntries(P);
  $("#fsum").textContent = [P2[S.period], S.company!=="all" ? CAT.companies[S.company] : "", S.emps.size ? "сотрудников: "+S.emps.size : ""].filter(Boolean).join(" · ");
  $("#empBtn").textContent = (S.emps.size ? `Выбрано: ${S.emps.size}` : "Все сотрудники") + " ▾";
}
function renderEmpList(){
  const counts = new Map();
  for(const [id,a] of Object.entries(CAT.ads)){ if(!a.act) continue; if(S.company!=="all" && a.c!==S.company) continue; const k = empKey(a); counts.set(k,(counts.get(k)||0)+1); }
  const items = [...counts].sort((a,b) => b[1]-a[1]);
  $("#empList").innerHTML = `<input type="search" id="empQ" placeholder="Найти сотрудника" style="width:100%;margin-bottom:6px">
    <div id="empItems">${items.map(([k,n]) => `<label data-name="${esc(empName(k).toLowerCase())}"><input type="checkbox" data-emp-k="${esc(k)}" ${S.emps.has(k)?"checked":""}> ${esc(empName(k))} <span class="muted">${n}</span></label>`).join("")}</div>
    <button class="btn" id="empClear" style="margin-top:6px">Снять выбор</button>`;
}

// ---------- события интерфейса
document.addEventListener("click", ev => {
  const dc=ev.target.closest("[data-dem-period],[data-dem-group],[data-dem-mode],[data-dem-metric],[data-dem-expand],[data-dem-more]");
  if(dc){
    for(const attr of ["period","group","mode","metric"]){if(dc.dataset["dem"+attr[0].toUpperCase()+attr.slice(1)]!==undefined){DEM[attr]=dc.dataset["dem"+attr[0].toUpperCase()+attr.slice(1)];DEM.opened=null;DEM.shown=40;render();return;}}
    if(dc.dataset.demExpand!==undefined){DEM.opened=DEM.opened===dc.dataset.demExpand?null:dc.dataset.demExpand;render();return;}
    if(dc.dataset.demMore!==undefined){DEM.shown+=40;render();return;}
  }
  const pt = ev.target.closest("[data-pother],[data-pmetric],[data-ptrend],[data-pagent]");
  if(pt){
    if(pt.dataset.pother !== undefined) PS.other = pt.dataset.pother && PS.other !== pt.dataset.pother ? pt.dataset.pother : null;
    if(pt.dataset.pmetric) PS.metric = pt.dataset.pmetric;
    if(pt.dataset.ptrend){ const a = pt.dataset.ptrend; PS.hidden.has(a) ? PS.hidden.delete(a) : PS.hidden.add(a); }
    if(pt.dataset.pagent) PS.agent = pt.dataset.pagent;
    render(); return;
  }
  const tk = ev.target.closest("[data-topkey]");
  if(tk){ const [id,k] = tk.dataset.topkey.split(":"); TOPKEY[id] = k; render(); return; }
  const ga = ev.target.closest("[data-area]");
  if(ga){ openGroup(ga.dataset.area); return; }
  const t = ev.target.closest("[data-period],[data-company],[data-tab],[data-sort],[data-ad],[data-emp],[data-more],#reset,#empBtn,#empClear,#closeDrawer");
  if(!t){ if(!ev.target.closest(".emp-box")) $("#empList").hidden = true; if(ev.target.id==="drawer") $("#drawer").style.display="none"; return; }
  if(t.dataset.period){ S.period = t.dataset.period; if(S.period==="custom" && !S.from){ S.to = todayStr(); S.from = addDays(S.to,-13); $("#dFrom").value=S.from; $("#dTo").value=S.to; } }
  else if(t.dataset.company){ S.company = t.dataset.company; }
  else if(t.dataset.tab){ S.tab = t.dataset.tab; S.limit = 60; }
  else if(t.dataset.sort){ const [tab,key] = t.dataset.sort.split(":"); const cur = S.sort[tab]; S.sort[tab] = {key, dir: cur && cur.key===key ? -cur.dir : -1}; }
  else if(t.dataset.ad){ openAd(t.dataset.ad); return; }
  else if(t.dataset.emp){ S.emps = new Set([t.dataset.emp]); S.tab = "ads"; }
  else if(t.dataset.more){ S.limit += 60; }
  else if(t.id === "reset"){ Object.assign(S, {period:"7", company:"all", emps:new Set(), newOnly:true, limit:60}); delete S.sort.emp; $("#newOnly").checked=true; }
  else if(t.id === "empBtn"){ const L = $("#empList"); if(L.hidden){ renderEmpList(); L.hidden = false; } else L.hidden = true; return; }
  else if(t.id === "empClear"){ S.emps.clear(); renderEmpList(); }
  else if(t.id === "closeDrawer"){ $("#drawer").style.display = "none"; return; }
  render(); saveState();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if(t.id==="demFrom"||t.id==="demTo"){DEM[t.id==="demFrom"?"from":"to"]=t.value;render();return;}
  if(t.dataset && t.dataset.empK !== undefined){ t.checked ? S.emps.add(t.dataset.empK) : S.emps.delete(t.dataset.empK); render(); saveState(); return; }
  if(t.id==="dFrom"){ S.from = t.value; render(); }
  if(t.id==="dTo"){ S.to = t.value; render(); }
  if(t.dataset && t.dataset.sortsel){ S.sort[t.dataset.sortsel] = {key:t.value, dir:-1}; S.limit = 60; render(); return; }
  if(t.id==="newOnly"){ S.newOnly = t.checked; render(); saveState(); }
});
let qTimer;
document.addEventListener("input", ev => {
  if(ev.target.id === "empQ"){ const q = ev.target.value.toLowerCase(); document.querySelectorAll("#empItems label").forEach(l => l.style.display = l.dataset.name.includes(q) ? "" : "none"); }
});
document.addEventListener("keydown", ev => { if(ev.key === "Escape"){ $("#drawer").style.display = "none"; $("#empList").hidden = true; } });
const tip = $("#tip");
document.addEventListener("mousemove", ev => {
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if(!t){ tip.style.display = "none"; return; }
  tip.textContent = t.dataset.tip; tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 270) + "px"; tip.style.top = (ev.clientY + 14) + "px";
});
function saveState(){ try{ localStorage.setItem("radar_f", JSON.stringify({period:S.period, tab:S.tab, company:S.company, newOnly:S.newOnly})); }catch(e){} }
function loadState(){ try{ const x = JSON.parse(localStorage.getItem("radar_f")||"{}"); Object.assign(S, x); }catch(e){} }

// ---------- старт
(async function(){
  // Всегда используем стартовые фильтры при загрузке страницы.
  if(!TABS.some(t => t[0] === S.tab)) S.tab = "employees";
  if(innerWidth < 640) $("#fbox").open = false;
  $("#newOnly").checked = S.newOnly;
  try{
    [CAT, CUBE, STATUS] = await Promise.all([getJSON("catalog"), getJSON("cube"), getJSON("status")]);
  }catch(e){
    $("#view").innerHTML = `<div class="center">Не удалось загрузить данные. Проверьте ссылку или обновите страницу через минуту.</div>`;
    $("#status").textContent = "Нет данных"; $("#status").classList.add("warn"); return;
  }
  S.company = Object.entries(CAT.companies).find(([key,label]) => String(label).trim() === "Этажи")?.[0] || "all";
  const rs = Object.values(CAT.ads).filter(a => a.pe && a.pu).map(a => a.pe/a.pu).sort((x,y)=>x-y);
  if(rs.length) EUR_RATE = rs[Math.floor(rs.length/2)];
  removeRobot();
  const age = (Date.now()/1000 - STATUS.last_run) / 3600;
  $("#status").textContent = "Обновлено " + dtLocal(STATUS.last_run);
  const h = new Date(Date.now()+TZ_OFF).getUTCHours();
  if(age > 2 && h >= 9) { $("#status").classList.add("warn"); $("#status").textContent += " — давно не обновлялось"; }
  render();
})();
</script>
</body>
